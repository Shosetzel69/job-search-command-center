# JSCC #531 — dedicated DEV-only service image build (no database container, no deployment).
# Does not call cloudbuild.promotion.yaml or the DEV-01B migration job.
substitutions:
  _GIT_SHA: ""
steps:
  - id: candidate-identity
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        [[ "${_GIT_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "Full source SHA required" >&2; exit 86; }
        if [[ -n "${COMMIT_SHA:-}" && "${COMMIT_SHA}" != "${_GIT_SHA}" ]]; then
          echo "Build source/commit SHA mismatch" >&2; exit 86
        fi
  - id: python-role-family
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        cd scripts
        python -m unittest -v test_role_taxonomy test_source_orchestration
  - id: api-role-family
    name: node:22-bookworm-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
        cd command-api
        npm install --ignore-scripts --no-audit --no-fund
        node --test test/*.test.mjs
  - id: frontend-role-family
    name: node:22-bookworm-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        cd frontend
        npm install --ignore-scripts --no-audit --no-fund
        node --test test/*.test.mjs
  - id: build-service-only
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker build --pull --file Dockerfile.service --build-arg "GIT_SHA=${_GIT_SHA}" -t "europe-west1-docker.pkg.dev/jscc-shared/jscc/jscc-service:${_GIT_SHA}" .
images:
  - "europe-west1-docker.pkg.dev/jscc-shared/jscc/jscc-service:${_GIT_SHA}"
serviceAccount: projects/jscc-shared/serviceAccounts/jscc-build@jscc-shared.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
