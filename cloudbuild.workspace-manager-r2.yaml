# JSCC #589 — DEV-only Workspace Manager R2 image build; no Cloud Run deployment.
substitutions:
  _GIT_SHA: ""
  _TRUSTED_REF: ""
  _MANAGER_BASE: "europe-west1-docker.pkg.dev/jscc-shared/jscc-ops/jscc-dev-workspace-manager@sha256:97ac5aab25242a65be391a6e6a048451d585a9df0d106713eb1f05ef8b39e3fb"
  _MANAGER_IMAGE: "europe-west1-docker.pkg.dev/jscc-shared/jscc-ops/jscc-dev-workspace-manager-r2"

steps:
  - id: trusted-source-admission
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args: ['scripts/gcp/verify_trusted_ops_ref.sh']
    env:
      - 'SOURCE_SHA=${_GIT_SHA}'
      - 'TRUSTED_OPS_REF=${_TRUSTED_REF}'

  - id: materialize-verified-source
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -ceu
      - |
        set -o pipefail
        git_root=/workspace/jscc589-verified-git
        source_root=/workspace/jscc589-verified-src
        [[ ! -e "$git_root" && ! -e "$source_root" ]]
        mkdir -p "$source_root"
        git init --quiet "$git_root"
        git -C "$git_root" remote add origin https://github.com/Shosetzel69/job-search-command-center.git
        git -C "$git_root" fetch --quiet --no-tags --depth=1 origin "${_TRUSTED_REF}"
        [[ "$(git -C "$git_root" rev-parse FETCH_HEAD)" == "${_GIT_SHA}" ]] || {
          echo "TRUSTED_BUILD_CONTEXT=BLOCKED source_sha_mismatch" >&2
          exit 42
        }
        git -C "$git_root" archive --format=tar "${_GIT_SHA}" | tar -xf - -C "$source_root"
        [[ -f "$source_root/ops/workspace-manager/Dockerfile.r2-tools" ]]
        [[ -f "$source_root/ops/workspace-manager/service/manager.py" ]]
        echo "TRUSTED_BUILD_CONTEXT=VERIFIED"

  - id: immutable-manager-baseline
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        [[ "${_GIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
        [[ "${_MANAGER_BASE}" == "europe-west1-docker.pkg.dev/jscc-shared/jscc-ops/jscc-dev-workspace-manager@sha256:97ac5aab25242a65be391a6e6a048451d585a9df0d106713eb1f05ef8b39e3fb" ]]
        [[ "${_MANAGER_IMAGE}" == "europe-west1-docker.pkg.dev/jscc-shared/jscc-ops/jscc-dev-workspace-manager-r2" ]]
        gcloud artifacts docker images describe "${_MANAGER_BASE}" --project=jscc-shared >/dev/null
        immutable="$(gcloud artifacts repositories describe jscc-ops --project=jscc-shared --location=europe-west1 --format='value(dockerConfig.immutableTags)')"
        [[ "$immutable" == "True" || "$immutable" == "true" ]]
        if gcloud artifacts docker images describe "${_MANAGER_IMAGE}:${_GIT_SHA}" --project=jscc-shared >/dev/null 2>&1; then
          echo "IMMUTABLE_TAG_ALREADY_EXISTS" >&2
          exit 1
        fi

  - id: workspace-manager-contract-tests
    name: python:3.12-slim-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        cd /workspace/jscc589-verified-src
        PYTHONPATH=ops/workspace-manager python3 -B -c 'from service.common import MAX_FILES, MAX_FILE, MAX_TOTAL; assert (MAX_FILES, MAX_FILE, MAX_TOTAL) == (100, 131072, 2097152)'
        python3 -m unittest discover -s ops/workspace-manager/tests -p 'test_workspace_*.py' -v

  - id: build-manager-r2
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull=false
      - --file=/workspace/jscc589-verified-src/ops/workspace-manager/Dockerfile.r2-tools
      - --build-arg=BASE_IMAGE=${_MANAGER_BASE}
      - --tag=${_MANAGER_IMAGE}:${_GIT_SHA}
      - /workspace/jscc589-verified-src

  - id: manager-image-route-smoke
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm -i --network=none --read-only --tmpfs /tmp \
          -e K_SERVICE= -e JSCC_LOCAL_BACKEND=/tmp/jscc589-smoke \
          -e WORKER_URL=http://127.0.0.1:9 -w /workspace \
          --entrypoint python3 "${_MANAGER_IMAGE}:${_GIT_SHA}" -B - <<'PY'
        import json
        import threading
        import urllib.error
        import urllib.request
        from http.server import ThreadingHTTPServer
        from service import manager
        from service.common import MAX_FILES

        assert MAX_FILES == 100
        manager.backend.put('smoke.txt', b'hello\n', 0)
        server = ThreadingHTTPServer(('127.0.0.1', 0), manager.Handler)
        thread = threading.Thread(target=server.serve_forever, daemon=True)
        thread.start()
        root = 'http://127.0.0.1:' + str(server.server_address[1])

        def request(method, path, payload=None):
            data = None if payload is None else json.dumps(payload).encode()
            req = urllib.request.Request(root + path, data=data, method=method,
                                         headers={'Content-Type': 'application/json'})
            with urllib.request.urlopen(req, timeout=5) as response:
                return response.status, json.load(response)

        try:
            assert request('GET', '/v1/files')[0] == 200
            assert request('GET', '/v1/file?path=smoke.txt')[0] == 200
            status, checksum = request('GET', '/v1/checksum?path=smoke.txt')
            assert status == 200 and checksum['generation'] == 1 and len(checksum['sha256']) == 64
            status, search = request('GET', '/v1/search?term=hello')
            assert status == 200 and search['matches'] == [{'path': 'smoke.txt', 'line': 1}]
            status, comparison = request('GET', '/v1/compare?left=smoke.txt&right=smoke.txt')
            assert status == 200 and comparison['equal'] is True
            status, patched = request('POST', '/v1/replace', {
                'path': 'smoke.txt', 'old': 'hello', 'new': 'updated', 'if_generation_match': 1
            })
            assert status == 200 and patched['generation'] == 2
            status, deleted = request('DELETE', '/v1/file?path=smoke.txt&if_generation_match=2')
            assert status == 200 and deleted['deleted'] is True
            print('MANAGER_IMAGE_ROUTE_SMOKE_PASS')
        finally:
            server.shutdown()
            server.server_close()
            thread.join(timeout=5)
        PY

  - id: push-manager-r2
    name: gcr.io/cloud-builders/docker
    args: [push, "${_MANAGER_IMAGE}:${_GIT_SHA}"]

  - id: digest-evidence
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        digest="$(gcloud artifacts docker images describe "${_MANAGER_IMAGE}:${_GIT_SHA}" --project=jscc-shared --format='value(image_summary.digest)')"
        [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        echo "JSCC589_MANAGER_R2_IMAGE=${_MANAGER_IMAGE}@${digest}"

serviceAccount: projects/jscc-shared/serviceAccounts/jscc-ops-build@jscc-shared.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
