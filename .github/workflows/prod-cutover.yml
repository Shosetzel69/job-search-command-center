name: PROD promotion

on:
  workflow_dispatch:
    inputs:
      action:
        description: Verify the already-deployed PROD identity only; PROD mutation is GCP-only
        required: true
        type: choice
        options: [verify-deployed-status]
      source_sha:
        description: Exact deployed source SHA
        required: true
        type: string
      expected_runtime_sha:
        description: Expected deployed PROD runtime_data_sha
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prod-status:
    if: ${{ inputs.action == 'verify-deployed-status' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Verify already-deployed PROD status semantics
        env:
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_RUNTIME_SHA: ${{ inputs.expected_runtime_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_sha must be a full immutable commit SHA" >&2; exit 1; }
          [[ "$EXPECTED_RUNTIME_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "expected_runtime_sha must be a full immutable commit SHA" >&2; exit 1; }
          if ! health="$(curl --fail --silent --show-error "$FRONTEND_ORIGIN/health")"; then
            echo "verify-deployed-status requires an already deployed PROD instance. Use the canonical GCP promotion path for deployment." >&2
            exit 1
          fi
          if ! jq -e --arg source "$SOURCE_SHA" --arg runtime "$EXPECTED_RUNTIME_SHA" \
            '.status == "ok" and .environment == "prod" and .source_sha == $source and .runtime_data_sha == $runtime and .search_mode == "live"' \
            <<<"$health" >/dev/null; then
            echo "Requested source/runtime is not the currently deployed PROD identity." >&2
            exit 1
          fi
          db_health="$(curl --fail --silent --show-error "$FRONTEND_ORIGIN/health/db")"
          jq -e '.status == "ok" and .environment == "prod" and .database == "jobsearch_prod"' <<<"$db_health" >/dev/null || {
            echo "verify-deployed-status database binding is not jobsearch_prod" >&2
            exit 1
          }
          echo "Already-deployed PROD identity and database binding verified for $SOURCE_SHA."
