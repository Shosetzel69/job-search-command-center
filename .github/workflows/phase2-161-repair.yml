name: Phase 2 161 repair

on:
  push:
    branches:
      - feat/161-phase2-environment-awareness

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/161-phase2-environment-awareness
          fetch-depth: 0

      - name: Apply scoped Phase 2 refactor
        run: python3 scripts/apply_phase2_161.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run search regressions
        run: |
          python3 -m py_compile scripts/job_search.py scripts/job_search_optimized.py scripts/job_search_apify.py scripts/job_search_runner.py scripts/source_orchestration.py scripts/job_search_web.py scripts/web_browser.py scripts/web_transport.py
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test

      - name: Command API tests and Wrangler dry-run
        working-directory: command-api
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run check

      - name: Restore non-stale generated identity placeholder
        run: |
          cat > command-api/src/build-identity.generated.js <<'EOF'
          export const BUILD_IDENTITY = Object.freeze({
            sourceSha: null,
            runtimeDataSha: null,
          });
          EOF

      - name: Commit validated Phase 2 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase2-161-apply.yml .github/workflows/phase2-161-repair.yml scripts/apply_phase2_161.py
          git add command-api frontend scripts .github/workflows/job-search-full.yml ARCHITECTURE.md docs/command-api.md CHANGELOG.md
          git diff --cached --check
          git commit -m '[FEAT][#161] Add Phase 2 environment-awareness contract'
          git push origin HEAD:feat/161-phase2-environment-awareness
