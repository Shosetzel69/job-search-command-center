name: Documentation policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Collect tracked Markdown files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          git ls-files '*.md' > changed-docs.txt
          {
            echo 'files<<EOF'
            cat changed-docs.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Check documentation policy
        if: steps.changed.outputs.files != ''
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < changed-docs.txt
          node scripts/check_documentation_policy.mjs "${files[@]}"
