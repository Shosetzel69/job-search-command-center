name: Package 1 frontend patch

on:
  push:
    branches:
      - feature/package-1-stabilization
    paths:
      - "scripts/apply_package1_frontend_patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/package-1-stabilization
      - name: Apply deterministic frontend patch
        run: python3 scripts/apply_package1_frontend_patch.py
      - name: Commit patched frontend
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/src/main.jsx; then
            echo "No frontend change produced"
            exit 1
          fi
          git config user.name "package1-automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/main.jsx
          git commit -m "Package 1: align frontend save and manual run"
          git push origin HEAD:feature/package-1-stabilization
