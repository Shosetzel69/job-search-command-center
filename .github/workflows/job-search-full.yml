name: Full job search

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/job-search-full.yml"
      - "data/search-config.json"
      - "scripts/job_search.py"
      - "scripts/job_search_optimized.py"
      - "scripts/job_search_apify.py"
      - "scripts/job_search_runner.py"
      - "scripts/source_orchestration.py"
      - "scripts/job_search_jobicy.py"
      - "scripts/job_search_web.py"
      - "scripts/web_transport.py"
      - "scripts/job_identity.py"
      - "shared/**"
      - "data/sources.json"
  workflow_dispatch:
  schedule:
    - cron: "0 6,15 * * *"

concurrency:
  group: full-job-search
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-filter-publish-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOBSPIPE_API_KEY: ${{ secrets.JOBSPIPE_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      RUN_TRIGGER: ${{ github.event_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate search engine syntax
        run: python3 -m py_compile scripts/job_search.py scripts/job_search_optimized.py scripts/job_search_apify.py scripts/job_search_runner.py

      - name: Collect, normalize, filter and score
        id: search
        continue-on-error: true
        run: python3 scripts/job_search_runner.py

      - name: Validate published JSON contract
        if: always()
        run: python3 scripts/job_search_runner.py --validate-only

      - name: Save results and run status safely
        if: always()
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cp data/jobs.json "$tmpdir/jobs.json"
          cp data/run-status.json "$tmpdir/run-status.json"
          cp data/run-history.json "$tmpdir/run-history.json"
          cp data/search-state.json "$tmpdir/search-state.json"

          git config user.name "job-search-automation"
          git config user.email "actions@users.noreply.github.com"

          published=false
          for attempt in 1 2 3; do
            echo "Publish attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            cp "$tmpdir/jobs.json" data/jobs.json
            cp "$tmpdir/run-status.json" data/run-status.json
            cp "$tmpdir/run-history.json" data/run-history.json
            cp "$tmpdir/search-state.json" data/search-state.json
            git add data/jobs.json data/run-status.json data/run-history.json data/search-state.json

            if git diff --cached --quiet; then
              echo "No data change"
              published=true
              break
            fi

            git commit -m "Update job search results"
            if git push origin HEAD:main; then
              published=true
              break
            fi

            echo "Main changed during publication; retrying from latest main"
            sleep $((attempt * 2))
          done

          if [ "$published" != "true" ]; then
            echo "Could not publish generated data after 3 attempts"
            exit 1
          fi

      - name: Mark total collection failure
        if: steps.search.outcome != 'success'
        run: |
          echo "All configured collection queries failed. Run status was persisted."
          exit 1

