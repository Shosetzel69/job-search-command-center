name: Full job search (retired source-repository runtime)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Legacy immutable source commit SHA; retained only for an explicit fail-closed tombstone
        required: true
        type: string

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject retired GitHub source-repository runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_SOURCE_REPO_SEARCH_RETIRED: heavy search runs on the GCP Cloud Run Search Job; this workflow cannot publish runtime data or access provider secrets." >&2
          exit 1
