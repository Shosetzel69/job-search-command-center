name: Full job search

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/job-search-full.yml"
      - "data/search-config.json"
      - "scripts/job_search.py"
  workflow_dispatch:
  schedule:
    - cron: "0 6,15 * * *"

concurrency:
  group: full-job-search
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-filter-publish-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOBSPIPE_API_KEY: ${{ secrets.JOBSPIPE_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate search engine syntax
        run: python3 -m py_compile scripts/job_search.py

      - name: Collect, normalize, filter and score
        id: search
        continue-on-error: true
        run: python3 scripts/job_search.py

      - name: Validate published JSON contract
        if: always()
        run: python3 scripts/job_search.py --validate-only

      - name: Save results and run status
        if: always()
        run: |
          git config user.name "job-search-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/run-status.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "Update job search results"
            git push
          fi

      - name: Mark total collection failure
        if: steps.search.outcome != 'success'
        run: |
          echo "All configured collection queries failed. Run status was persisted."
          exit 1
