name: DEV 489 remediation acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dev-489-remediation-acceptance.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEV_ORIGIN: https://jscc-command-api-dev-828902654738.europe-west1.run.app
      CANDIDATE_SHA: c1af3628c6aacff5d0d7fc03c81ae323adeba2b7
    steps:
      - name: Wait for exact remediation candidate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if body="$(curl --fail --silent --show-error "$DEV_ORIGIN/health" 2>/dev/null)"; then
              echo "$body" | jq .
              if jq -e --arg sha "$CANDIDATE_SHA" '.status == "ok" and .environment == "dev" and .source_sha == $sha and .runtime_data_sha == $sha and .runtime_backend == "gcp"' <<<"$body" >/dev/null; then
                exit 0
              fi
            fi
            sleep 15
          done
          echo "DEV did not expose exact remediation candidate" >&2
          exit 1

      - name: Verify DEV DB and auth config
        shell: bash
        run: |
          set -euo pipefail
          db="$(curl --fail --silent --show-error "$DEV_ORIGIN/health/db")"
          echo "$db" | jq .
          jq -e '.status == "ok" and .environment == "dev" and .database == "jobsearch_dev"' <<<"$db" >/dev/null
          auth="$(curl --fail --silent --show-error "$DEV_ORIGIN/auth/config")"
          echo "$auth" | jq .
          jq -e '.configured == true and (.client_id | type == "string" and length > 0)' <<<"$auth" >/dev/null

      - name: F4 malformed Google credential returns generic 401
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/body --write-out '%{http_code}'             -X POST "$DEV_ORIGIN/auth/session"             -H "Origin: $DEV_ORIGIN"             -H 'Authorization: Bearer abc')"
          cat /tmp/body
          test "$code" = "401"
          jq -e '.error == "Invalid Google ID token"' /tmp/body >/dev/null
          ! grep -Eqi 'jose|jws|jwk|compact|multiple matching keys' /tmp/body

      - name: Verify frontend Criteria payload no longer contains JobsPipe fields
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$DEV_ORIGIN/" -o /tmp/index.html
          asset="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/index.html | head -1 | cut -d'"' -f2)"
          test -n "$asset"
          curl --fail --silent --show-error "$DEV_ORIGIN$asset" -o /tmp/app.js
          grep -Fq '/me/preferences' /tmp/app.js
          grep -Fq 'preferencePatchFromCriteria' /tmp/app.js || true
          # System fields may exist in ADMIN code, but the old Criteria model serialization signature must be gone.
          if grep -Fq 'JSON.stringify(draftCriteria)' /tmp/app.js; then
            echo "Legacy whole-draft Criteria serialization remains in live bundle" >&2
            exit 1
          fi

      - name: Verify protected canonical endpoints remain fail closed without session
        shell: bash
        run: |
          set -euo pipefail
          for spec in             "GET /me"             "GET /me/jobs"             "GET /me/preferences"             "GET /applications"             "POST /me/refresh"             "POST /admin/refresh"; do
            method="${spec%% *}"
            path="${spec#* }"
            code="$(curl --silent --output /tmp/body --write-out '%{http_code}' -X "$method" "$DEV_ORIGIN$path")"
            echo "$method $path -> $code"
            test "$code" = "401"
          done
