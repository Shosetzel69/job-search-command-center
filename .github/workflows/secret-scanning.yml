name: Secret scanning

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location "$url" -o "$RUNNER_TEMP/gitleaks/$archive"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/gitleaks/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Verify scanner self-test
        shell: bash
        run: bash scripts/security/gitleaks-selftest.sh

      - name: Select immutable scan range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test -n "$PR_BASE_SHA"
            test -n "$PR_HEAD_SHA"
            printf 'log_opts=%s..%s\n' "$PR_BASE_SHA" "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            printf 'log_opts=%s..%s\n' "$PUSH_BEFORE_SHA" "$PUSH_SHA" >> "$GITHUB_OUTPUT"
          else
            printf 'log_opts=--all\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Scan committed changes for secrets
        shell: bash
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          set -euo pipefail
          gitleaks git --config .gitleaks.toml --redact --verbose --no-banner --log-opts="$LOG_OPTS" .
