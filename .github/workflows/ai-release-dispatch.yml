name: AI release dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: ${{ github.actor == 'Shosetzel69' && (startsWith(github.event.comment.body, '/jscc-deploy') || startsWith(github.event.comment.body, '/jscc-search') || startsWith(github.event.comment.body, '/jscc-validate')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted control-plane from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Parse owner command and dispatch canonical environment workflow
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          set -euo pipefail
          envelope="$(node scripts/environment/ai-release-dispatch.mjs)"
          workflow="$(jq -r '.workflow' <<<"$envelope")"
          payload="$(jq -c '.payload' <<<"$envelope")"
          case "$workflow" in
            deploy-environment.yml|test-full-search.yml|dev-source-validation.yml) ;;
            *) echo "Unexpected workflow target" >&2; exit 1 ;;
          esac
          printf '%s' "$payload" | gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
            --input -
          {
            echo "### AI control dispatch"
            echo
            echo "Accepted owner command from issue #$ISSUE_NUMBER / comment $COMMENT_ID."
            echo "Allowlisted workflow: $workflow."
            echo "PROD search/validation is not supported by this trigger."
          } >> "$GITHUB_STEP_SUMMARY"
