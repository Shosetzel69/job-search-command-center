name: Apply JobsPipe Apify refactor

on:
  push:
    branches:
      - feature/jobspipe-apify-mode
    paths:
      - "scripts/_apply_jobspipe_apify_refactor.py"
      - ".github/workflows/apply-jobspipe-apify-refactor.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/jobspipe-apify-mode

      - name: Apply refactor
        run: python3 scripts/_apply_jobspipe_apify_refactor.py

      - name: Validate Python
        run: python3 -m py_compile scripts/job_search.py scripts/job_search_optimized.py scripts/job_search_apify.py scripts/job_search_runner.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Worker dependencies
        working-directory: command-api
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate React frontend and Worker build
        working-directory: command-api
        run: npm run check

      - name: Commit refactor output
        run: |
          git config user.name "job-search-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/search-config.json \
            scripts/job_search.py scripts/job_search_apify.py scripts/job_search_runner.py \
            command-api/src/index.js frontend/src/main.jsx \
            docs/requirements.md docs/functionalitati.md docs/architecture.md docs/data-contract.md docs/source-strategy.md \
            README.md CHANGELOG.md
          git commit -m "Add configurable JobsPipe transport" || exit 0
          git push origin HEAD:feature/jobspipe-apify-mode
