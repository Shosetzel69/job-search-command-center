name: AI GitHub bridge check

on:
  pull_request:
    paths:
      - "ai-github-bridge/**"
      - "docs/adr/ADR-002-ai-github-bridge.md"
      - "docs/analysis/2026-09-09-ai-github-bridge.md"
      - "ARCHITECTURE.md"
      - "CHANGELOG.md"
      - ".github/workflows/ai-github-bridge-check.yml"
  push:
    branches: [main]
    paths:
      - "ai-github-bridge/**"
      - ".github/workflows/ai-github-bridge-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-github-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Worker dry-run
        run: npm run check
