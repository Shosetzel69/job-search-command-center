name: AI GitHub bridge check

on:
  pull_request:
    paths:
      - "ai-github-bridge/**"
      - "docs/adr/ADR-002-ai-github-bridge.md"
      - "docs/analysis/2026-09-09-ai-github-bridge.md"
      - "ARCHITECTURE.md"
      - "CHANGELOG.md"
      - ".github/workflows/ai-github-bridge-check.yml"
  push:
    branches: [main]
    paths:
      - "ai-github-bridge/**"
      - ".github/workflows/ai-github-bridge-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-github-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Worker dry-run
        run: npm run check
