# P4 #663/#675: DEV Command API Service only. No legacy promotion.
# DEV-only manually dispatched release; public comments cannot trigger this privileged job.
name: GOV85 P4 675 DEV Service-only release
on:
  pull_request:
    paths:
      - '.github/workflows/gov85-p4-675-dev-service.yml'
      - 'scripts/gcp/gov85_p4_675_dev_release.sh'
      - 'scripts/gcp/gov85_p4_675_dev_guard.py'
      - 'scripts/test_gov85_p4_675_dev.py'
  workflow_dispatch:
    inputs:
      action:
        description: "P4 DEV operation, separately approved in environment dev"
        required: true
        type: choice
        options: [preflight, release]
      source_sha:
        description: "Exact immutable approved P4 application SHA"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  id-token: write

jobs:
  source-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Syntax, scope and isolation checks, no cloud mutation
        run: |
          set -euo pipefail
          bash -n scripts/gcp/gov85_p4_675_dev_release.sh
          python3 -m py_compile scripts/gcp/gov85_p4_675_dev_guard.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v scripts.test_gov85_p4_675_dev
          grep -Fq 'exit 86' cloudbuild.promotion.yaml
          grep -Fq 'exit 86' scripts/gcp/promote.sh

      - name: Verify LIVE exact post-merge checks on immutable application SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=b8fa506987bd79053f5c3cf86137f32e41a4095b
          gh api "repos/$GITHUB_REPOSITORY/commits/$target/check-runs?per_page=100" \
            >/tmp/jscc-p4-main-checks-ci.json
          python3 scripts/gcp/gov85_p4_675_dev_guard.py postmerge-ci \
            /tmp/jscc-p4-main-checks-ci.json "$target"

  p4-service-release:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'Shosetzel69' && github.ref == 'refs/heads/main'
    concurrency:
      group: gov85-p4-675-dev-service-only
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 65
    env:
      GCP_WIF_PROVIDER: ${{ vars.JSCC_DEV_GCP_WIF_PROVIDER }}
      GCP_WIF_SA: ${{ vars.JSCC_DEV_R2_DEPLOYER_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout trusted main control-plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Admit exact manual dispatch, PR675 merge identity and post-merge CI
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.action }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Shosetzel69/job-search-command-center || exit 86
          test "$GITHUB_REF" = refs/heads/main || exit 86
          test "$ACTOR" = Shosetzel69 || exit 86
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA" || exit 86
          target=b8fa506987bd79053f5c3cf86137f32e41a4095b
          test "$GITHUB_EVENT_NAME" = workflow_dispatch || exit 86
          test "$SOURCE_SHA" = "$target" || { echo JSCC_P4_UNAPPROVED_SOURCE; exit 86; }
          case "$MODE" in
            preflight|release) mode="$MODE" ;;
            *) echo JSCC_P4_UNAPPROVED_OPERATION; exit 86 ;;
          esac
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/675")"
          test "$(jq -r '.merged' <<<"$pr")" = true || exit 86
          test "$(jq -r '.merge_commit_sha' <<<"$pr")" = "$target" || exit 86
          test "$(jq -r '.head.sha' <<<"$pr")" = d699b6efb1074c77ac3e5fdd2062ef182b6f2f9a || exit 86
          # The GitHub check-runs endpoint reports *job* names. Check source
          # SHA, app identity, completed/success and all five exact job names.
          gh api "repos/$GITHUB_REPOSITORY/commits/$target/check-runs?per_page=100" \
            > /tmp/jscc-p4-main-checks.json
          python3 control/scripts/gcp/gov85_p4_675_dev_guard.py postmerge-ci \
            /tmp/jscc-p4-main-checks.json "$target"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "source_sha=$target" >> "$GITHUB_OUTPUT"
          echo "JSCC_P4_MODE=$mode" >> "$GITHUB_STEP_SUMMARY"
          echo "JSCC_P4_EXACT_SOURCE=$target" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout immutable P4 application SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.scope.outputs.source_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify candidate and DEV-only control scripts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = b8fa506987bd79053f5c3cf86137f32e41a4095b
          test -z "$(git -C candidate status --porcelain)"
          test -z "$(git -C control status --porcelain)"
          test -n "$GCP_WIF_PROVIDER" && test -n "$GCP_WIF_SA" || exit 86
          bash -n control/scripts/gcp/gov85_p4_675_dev_release.sh
          python3 -m py_compile control/scripts/gcp/gov85_p4_675_dev_guard.py
          (cd control && PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v scripts.test_gov85_p4_675_dev)
      # DEV Required Reviewers must be preconfigured by the owner. This
      # workflow checks the presence of that protection but cannot prove the
      # reviewer is human when agents share the owner's GitHub identity.
      # No environment settings are modified; independent release approval
      # remains a separate operational gate before any GCP mutation.
      - name: Verify required DEV environment review protection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/dev" > /tmp/jscc-p4-dev-environment.json
          jq -e 'any(.protection_rules[]?; .type == "required_reviewers" and ((.reviewers // []) | length > 0))' \
            /tmp/jscc-p4-dev-environment.json >/dev/null || {
            echo JSCC_P4_DEV_REQUIRED_REVIEWERS_UNVERIFIED
            exit 86
          }
          echo JSCC_P4_DEV_ENVIRONMENT_REVIEW_PROTECTION=PASS
      - name: Authenticate using existing DEV WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: jscc-shared
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SA }}
      - name: Install pinned gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: V5 verify DEV WIF deployment permissions without mutation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GCP_WIF_SA" != "jscc-app-deployer-dev@jscc-dev.iam.gserviceaccount.com" ]]; then
            echo JSCC_P4_V5_WRONG_DEPLOYER_IDENTITY
            exit 86
          fi
          python3 - <<'PY'
          import json
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request

          try:
              token = subprocess.check_output(
                  ["gcloud", "auth", "print-access-token"],
                  text=True, stderr=subprocess.DEVNULL
              ).strip()
          except (subprocess.CalledProcessError, OSError):
              print("JSCC_P4_V5_ACCESS_TOKEN_DENIED")
              raise SystemExit(86)
          if not token:
              print("JSCC_P4_V5_ACCESS_TOKEN_MISSING")
              raise SystemExit(86)

          def probe(label, url, required, method="POST"):
              data = json.dumps({"permissions": required}).encode("utf-8") if method == "POST" else None
              request = urllib.request.Request(
                  url, data=data,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                  },
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  print(f"JSCC_P4_V5_{label}_HTTP_{exc.code}")
                  raise SystemExit(86)
              except (urllib.error.URLError, ValueError, OSError):
                  print(f"JSCC_P4_V5_{label}_REQUEST_FAILED")
                  raise SystemExit(86)
              if (not isinstance(payload, dict) or
                  not isinstance(payload.get("permissions", []), list)):
                  print(f"JSCC_P4_V5_{label}_INVALID_RESPONSE")
                  raise SystemExit(86)
              if not all(isinstance(item, str) for item in payload.get("permissions", [])):
                  print(f"JSCC_P4_V5_{label}_INVALID_RESPONSE")
                  raise SystemExit(86)
              granted = set(payload.get("permissions", []))
              missing = set(required) - granted
              if missing:
                  for permission in sorted(missing):
                      print(f"JSCC_P4_V5_MISSING_{label}={permission}")
                  raise SystemExit(86)
              print(f"JSCC_P4_V5_{label}_IAM=PASS")

          checks = (
              ("build-project", "https://cloudresourcemanager.googleapis.com/v1/projects/jscc-shared:testIamPermissions",
               ["cloudbuild.builds.create", "cloudbuild.builds.get",
                "cloudbuild.builds.list", "serviceusage.services.use",
                "storage.buckets.list"]),
              ("build-sa", "https://iam.googleapis.com/v1/projects/jscc-shared/serviceAccounts/jscc-build@jscc-shared.iam.gserviceaccount.com:testIamPermissions",
               ["iam.serviceAccounts.actAs"]),
              ("deployer-sa", "https://iam.googleapis.com/v1/projects/jscc-dev/serviceAccounts/jscc-app-deployer-dev@jscc-dev.iam.gserviceaccount.com:testIamPermissions",
               ["iam.serviceAccounts.getOpenIdToken"]),
              ("runtime-sa", "https://iam.googleapis.com/v1/projects/jscc-dev/serviceAccounts/jscc-dev-runtime@jscc-dev.iam.gserviceaccount.com:testIamPermissions",
               ["iam.serviceAccounts.actAs"]),
              ("registry", "https://artifactregistry.googleapis.com/v1/projects/jscc-shared/locations/europe-west1/repositories/jscc:testIamPermissions",
               ["artifactregistry.repositories.get", "artifactregistry.repositories.downloadArtifacts"]),
              ("service", "https://run.googleapis.com/v2/projects/jscc-dev/locations/europe-west1/services/jscc-command-api-dev:testIamPermissions",
               ["run.services.get", "run.services.update", "run.routes.invoke"]),
          )
          for label, url, required in checks:
              probe(label, url, required)

          bucket = "jscc-shared_cloudbuild"
          url = ("https://storage.googleapis.com/storage/v1/b/" +
                 urllib.parse.quote(bucket, safe="") + "/iam/testPermissions?" +
                 urllib.parse.urlencode({"permissions": ["storage.objects.create",
                                                           "storage.buckets.get"]}, doseq=True))
          probe("build-staging", url, ["storage.objects.create", "storage.buckets.get"], method="GET")
          PY
          if ! gcloud builds list --project=jscc-shared --region=europe-west1 \
            --limit=1 --format='value(id)' >/dev/null 2>/tmp/jscc-p4-v5-build-list-error; then
            echo JSCC_P4_V5_CLOUD_BUILD_LIST_DENIED
            exit 86
          fi
          if ! gcloud artifacts repositories describe jscc --project=jscc-shared \
            --location=europe-west1 --format='value(name)' >/dev/null 2>/tmp/jscc-p4-v5-registry-error; then
            echo JSCC_P4_V5_ARTIFACT_REGISTRY_READ_DENIED
            exit 86
          fi
          if ! gcloud run services describe jscc-command-api-dev --project=jscc-dev \
            --region=europe-west1 --format='value(metadata.name)' >/dev/null 2>/tmp/jscc-p4-v5-run-error; then
            echo JSCC_P4_V5_CLOUD_RUN_SERVICE_READ_DENIED
            exit 86
          fi
          if ! gcloud run revisions describe jscc-command-api-dev-00100-mek --project=jscc-dev \
            --region=europe-west1 --format='value(status.imageDigest)' >/dev/null 2>/tmp/jscc-p4-v5-revision-error; then
            echo JSCC_P4_V5_CLOUD_RUN_REVISION_READ_DENIED
            exit 86
          fi
          echo JSCC_P4_V5_READONLY_PERMISSION_PROBE=PASS
      - name: DEV preflight OR owner-authorized Service stage and cutover
        shell: bash
        env:
          JSCC_P4_RELEASE_GATE: ${{ steps.scope.outputs.mode == 'release' && 'APPROVE_P4_675_B8FA506_DEV_SERVICE_ONLY' || '' }}
        run: |
          set -euo pipefail
          bash control/scripts/gcp/gov85_p4_675_dev_release.sh \
            "${{ steps.scope.outputs.mode }}" "${{ steps.scope.outputs.source_sha }}"
          echo JSCC_P4_NO_RETRIEVE_NO_JOB_NO_NILE_DDL_NO_TEST_PROD >> "$GITHUB_STEP_SUMMARY"
