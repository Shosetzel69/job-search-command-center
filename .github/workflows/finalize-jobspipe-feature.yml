name: Finalize JobsPipe feature

on:
  push:
    branches:
      - feature/jobspipe-apify-mode
    paths:
      - "scripts/_finalize_jobspipe_feature.py"
      - ".github/workflows/finalize-jobspipe-feature.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/jobspipe-apify-mode

      - name: Apply finalizer
        run: python3 scripts/_finalize_jobspipe_feature.py

      - name: Validate Python and disabled mode
        run: |
          python3 -m py_compile scripts/job_search.py scripts/job_search_optimized.py scripts/job_search_apify.py scripts/job_search_runner.py
          python3 scripts/job_search_runner.py --validate-only

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Worker dependencies
        working-directory: command-api
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate frontend and Worker
        working-directory: command-api
        run: npm run check

      - name: Commit finalized files
        run: |
          git config user.name "job-search-automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/main.jsx frontend/package.json \
            docs/requirements.md docs/architecture.md docs/functionalitati.md docs/data-contract.md docs/command-api.md
          git commit -m "Finalize JobsPipe transport configuration" || exit 0
          git push origin HEAD:feature/jobspipe-apify-mode
