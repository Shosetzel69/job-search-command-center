name: Package 1 architecture patch

on:
  push:
    branches:
      - feature/package-1-stabilization
    paths:
      - "scripts/apply_package1_architecture_patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/package-1-stabilization
      - name: Apply architecture and changelog patch
        run: python3 scripts/apply_package1_architecture_patch.py
      - name: Commit documentation alignment
        run: |
          set -euo pipefail
          git config user.name "package1-automation"
          git config user.email "actions@users.noreply.github.com"
          git add ARCHITECTURE.md CHANGELOG.md docs/archive/architecture/ARCHITECTURE-v1.3.md
          git commit -m "Package 1: align architecture and changelog"
          git push origin HEAD:feature/package-1-stabilization
