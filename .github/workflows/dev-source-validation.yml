name: Controlled DEV source validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character candidate commit SHA"
        required: true
        type: string
      source_ids:
        description: "Comma-separated canonical source IDs (1..20)"
        required: true
        type: string
      confirm_validation:
        description: "Type VALIDATE to confirm read-only DEV source validation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dev-source-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate explicit source cohort
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    steps:
      - name: Verify trusted manual dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ inputs.confirm_validation }}" = "VALIDATE"
          [[ "${{ inputs.source_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s' "${{ inputs.source_sha }}" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Preflight cohort and detect browser need
        id: preflight
        env:
          SOURCE_IDS: ${{ inputs.source_ids }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts")
          import source_validation

          source_ids = source_validation.parse_source_ids(os.environ["SOURCE_IDS"])
          items = source_validation.prepare_validation_items(source_validation.load_catalog(), source_ids)
          needs_browser = any(item.get("connector") == "web" for item in items)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"needs_browser={'true' if needs_browser else 'false'}\n")
          print(f"Validated {len(items)} source IDs; browser fallback required: {needs_browser}")
          PY

      - name: Install existing web browser fallback
        if: ${{ steps.preflight.outputs.needs_browser == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r requirements-search.txt
          python3 -m playwright install --with-deps chromium

      - name: Run read-only source validation
        id: validation
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_IDS: ${{ inputs.source_ids }}
        shell: bash
        run: |
          set +e
          python3 scripts/source_validation.py             --source-sha "$SOURCE_SHA"             --source-ids "$SOURCE_IDS"             --output validation-evidence/source-validation.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-source-validation-${{ inputs.source_sha }}
          path: validation-evidence/source-validation.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail closed on preflight or system error
        if: ${{ steps.validation.outputs.exit_code != '0' }}
        shell: bash
        run: |
          echo "Source validation failed with exit code ${{ steps.validation.outputs.exit_code }}"
          exit 1
