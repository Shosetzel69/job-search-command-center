name: Cloud Run Admin API v2 contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-version-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test v1 detection rules
        run: node --test scripts/test_cloud_run_api_version.mjs
      - name: Validate gateway v2 service-scaling fixtures
        run: python3 -m unittest -v scripts.test_gateway_v2_scaling
      - name: Enforce Cloud Run Admin API v2
        run: node scripts/check_cloud_run_api_version.mjs
