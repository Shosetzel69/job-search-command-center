name: Validate Command API

on:
  push:
    branches: [main]
    paths:
      - "command-api/**"
      - "frontend/**"
      - "scripts/**"
      - "shared/**"
      - "requirements-search.txt"
      - "data/sources.json"
      - "data/source-categories.json"
      - "data/nomenclatures.json"
      - "data/applications.json"
      - "data/search-config.json"
      - "data/run-history.json"
      - ".github/workflows/command-api-check.yml"
      - ".github/workflows/job-search-full.yml"
      - ".github/workflows/deploy-environment.yml"
      - ".github/workflows/ai-release-dispatch.yml"
      - ".github/workflows/record-test-pass.yml"
      - ".github/workflows/prod-cutover.yml"
      - "config/environments.json"
      - "config/prod-baseline-migration-332.json"
      - "config/provenance/prod-baseline-332/**"
      - "cloudbuild.m01.candidate.dev.yaml"
      - "m01_r8_gate.py"
      - "m01_r8_provenance.py"
      - "test_m01_r8.py"
      - "package.json"
  pull_request:
    paths:
      - "command-api/**"
      - "frontend/**"
      - "scripts/**"
      - "shared/**"
      - "requirements-search.txt"
      - "data/sources.json"
      - "data/source-categories.json"
      - "data/nomenclatures.json"
      - "data/applications.json"
      - "data/search-config.json"
      - "data/run-history.json"
      - ".github/workflows/command-api-check.yml"
      - ".github/workflows/job-search-full.yml"
      - ".github/workflows/deploy-environment.yml"
      - ".github/workflows/ai-release-dispatch.yml"
      - ".github/workflows/record-test-pass.yml"
      - ".github/workflows/prod-cutover.yml"
      - "config/environments.json"
      - "config/prod-baseline-migration-332.json"
      - "config/provenance/prod-baseline-332/**"
      - "cloudbuild.m01.candidate.dev.yaml"
      - "m01_r8_gate.py"
      - "m01_r8_provenance.py"
      - "test_m01_r8.py"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate Python syntax and search configuration
        run: |
          python3 -m py_compile scripts/job_search.py scripts/job_search_optimized.py scripts/job_search_apify.py scripts/job_search_runner.py scripts/shared_corpus_repository.py scripts/shared_corpus_import.py scripts/source_orchestration.py scripts/job_search_public_boards.py scripts/job_search_softgarden.py scripts/job_search_eightfold_public.py scripts/job_search_web.py scripts/web_browser.py scripts/web_transport.py scripts/test_search_logic.py scripts/test_shared_corpus_repository.py scripts/role_taxonomy.py scripts/test_role_taxonomy.py
          bash -n scripts/multiuser-db-backup.sh scripts/multiuser-db-restore-verify.sh
          python3 - <<'PY'
          import json
          import sys
          sys.path.insert(0, "scripts")
          import job_search
          import job_search_runner

          config = job_search.load_config()
          assert job_search.configured_titles(config)
          assert job_search_runner.HISTORY_LIMIT == 10
          history = json.load(open("data/run-history.json", encoding="utf-8"))
          assert history.get("schema_version") == job_search.SCHEMA_VERSION
          assert isinstance(history.get("runs"), list)
          assert len(history["runs"]) <= 10
          print("Python modules, geography configuration and run history are valid")
          PY

      - name: Validate shared role taxonomy gate
        run: python3 scripts/role_taxonomy.py validate

      - name: Guard full search manual-only trigger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/job-search-full.yml').read_text(encoding='utf-8')
          assert 'workflow_dispatch:' in workflow, 'Full search must expose workflow_dispatch'
          assert '\n  push:' not in workflow, 'Full search must not run on push'
          assert '\n  schedule:' not in workflow, 'Full search scheduler is disabled in Package 1/2A'
          assert 'run_trigger:' in workflow and 'manual-ui' in workflow, 'Canonical manual trigger is missing'
          print('Full search remains manual-only in Package 2A')
          PY

      - name: Install M01 test dependency
        run: python3 -m pip install PyYAML==6.0.2

      - name: Run search logic regression tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Run M01 R8 offline source contract tests
        run: |
          python3 -B -m unittest -v test_m01_r8.py
          python3 -O -B -m unittest -v test_m01_r8.py
          python3 -OO -B -m unittest -v test_m01_r8.py

      - name: Run Zoho source and pipeline integration regression tests
        run: PYTHONPATH=scripts python3 -m unittest discover -s tests -p "test_zoho*.py" -v

      - name: Verify backup restore refuses PROD
        run: |
          set +e
          RESTORE_DATABASE_URL="postgresql://runtime:x@localhost/jobsearch_prod" \
          BACKUP_FILE="/tmp/not-used.dump" \
          BACKUP_SHA256_FILE="/tmp/not-used.sha256" \
          bash scripts/multiuser-db-restore-verify.sh > /tmp/restore.out 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          grep -q "Refusing restore into PROD" /tmp/restore.out

      - name: Validate JSON contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("data/search-config.json"),
              Path("data/run-history.json"),
              Path("data/sources.json"),
              Path("data/source-categories.json"),
              Path("data/nomenclatures.json"),
              Path("data/applications.json"),
          ]
          payloads = {}
          for path in paths:
              payloads[path.name] = json.loads(path.read_text(encoding="utf-8"))
              print(f"valid JSON: {path}")

          assert payloads["sources.json"].get("schema_version") == "1.0"
          assert payloads["applications.json"].get("schema_version") == "1.0"

          categories = payloads["source-categories.json"]
          assert categories.get("schema_version") == "1.0"
          assert categories.get("count") == len(categories.get("categories", []))
          labels = [str(item.get("label", "")).strip().casefold() for item in categories.get("categories", [])]
          assert all(labels) and len(labels) == len(set(labels))

          nomenclatures = payloads["nomenclatures.json"]
          assert nomenclatures.get("schema_version") == "1.0"
          domains = nomenclatures.get("domains") or {}
          required_domains = {
              "regions", "countries", "work_modes", "contract_types",
              "application_statuses", "seniority",
          }
          assert set(domains) == required_domains
          for domain_name, domain in domains.items():
              assert domain.get("kind") in {"system", "extensible"}, domain_name
              assert isinstance(domain.get("extensible"), bool), domain_name
              assert (domain.get("kind") == "extensible") == domain.get("extensible"), domain_name
              values = domain.get("values")
              assert isinstance(values, list), domain_name
              codes = [str(item.get("code", "")).strip() for item in values]
              labels = [str(item.get("label", "")).strip().casefold() for item in values]
              assert all(codes) and len(codes) == len(set(codes)), domain_name
              assert all(labels) and len(labels) == len(set(labels)), domain_name
              for item in values:
                  assert isinstance(item.get("active"), bool), (domain_name, item)
                  assert isinstance(item.get("sort_order"), int), (domain_name, item)

          countries = {item["code"] for item in domains["countries"]["values"]}
          regions = {item["code"]: item for item in domains["regions"]["values"]}
          assert set(regions) == {"EU", "US", "ASIA"}
          assert regions["EU"]["label"] == "Uniunea Europeana"
          for region in regions.values():
              members = region.get("country_codes") or []
              assert members and len(members) == len(set(members))
              assert set(members) <= countries

          work_modes = {item["code"] for item in domains["work_modes"]["values"]}
          assert work_modes == {"remote", "hybrid", "onsite"}
          contract_types = {item["code"] for item in domains["contract_types"]["values"]}
          assert contract_types == {"permanent", "temporary", "contract", "freelance"}
          application_statuses = {item["code"] for item in domains["application_statuses"]["values"]}
          assert "applied" in application_statuses
          assert domains["seniority"]["values"] == []

          print("Package 2A/2A8 data contracts are versioned and consistent")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run environment automation tests
        run: npm run test:environment

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Install Worker dependencies
        working-directory: command-api
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate ADR-008 tenant boundary
        working-directory: command-api
        run: npm run check:tenant-boundary

      - name: Assert retired migrations are still disabled (E86)
        working-directory: command-api
        run: |
          set +e
          node scripts/db-migrate.mjs > /tmp/w025_direct.out 2>&1
          direct_rc=$?
          npm run db:migrate > /tmp/w025_npm.out 2>&1
          npm_rc=$?
          set -e
          test "$direct_rc" -eq 86
          test "$npm_rc" -ne 0
          grep -q JSCC541_DEV01B_MIGRATION_ENTRYPOINT_DISABLED /tmp/w025_direct.out
          grep -q JSCC541_DEV01B_MIGRATION_ENTRYPOINT_DISABLED /tmp/w025_npm.out

      - name: Run Command API unit tests
        working-directory: command-api
        run: npm test

      - name: Validate React frontend and Worker build
        working-directory: command-api
        run: npm run check


  nile-contract-evidence:
    if: github.event_name != 'workflow_dispatch'
    name: Nile-only native provider CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: dev
      NILE_TESTING_DB_NAME: jobsearch_dev
      JSCC_ALLOW_DEV_TEST_SHARED_DB_ROLE: "true"
      NILE_TEST_DATABASE_URL: postgresql://00000000-0000-0000-0000-000000000000:password@127.0.0.1:55432/jobsearch_dev
      NILE_DATABASE_URL: postgresql://00000000-0000-0000-0000-000000000000:password@127.0.0.1:55432/jobsearch_dev
      NILE_MIGRATION_DATABASE_URL: postgresql://00000000-0000-0000-0000-000000000000:password@127.0.0.1:55432/jobsearch_dev
      JSCC_INTEGRATION_DATABASE_URL: postgresql://00000000-0000-0000-0000-000000000000:password@127.0.0.1:55432/jobsearch_dev
      JSCC_TEST_ADMIN_DATABASE_URL: postgresql://00000000-0000-0000-0000-000000000000:password@127.0.0.1:55432/jobsearch_dev
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: command-api
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Start official immutable Nile testing image
        id: nile
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/niledatabase/testingcontainer@sha256:8e670df2a40b0cde96e01cccd62fc34d93bf97c065307d653a5cac940a82b869
          docker pull "$image"
          docker buildx imagetools inspect "$image" | grep -F 'sha256:8e670df2a40b0cde96e01cccd62fc34d93bf97c065307d653a5cac940a82b869'
          id="$(docker run -d --name "w025-nile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -e NILE_TESTING_DB_NAME=jobsearch_dev -p 127.0.0.1:55432:5432 "$image")"
          echo "W025_NILE_CONTAINER_ID=$id" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do
            if docker logs "$id" 2>&1 | grep -q 'Database has been created and is ready'; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$id"
          exit 1
      - name: Admit exact runner container and all database bindings
        working-directory: command-api
        run: node scripts/nile-ci-local-admission.mjs
      - name: Execute mandatory Nile suites with process-bound TAP evidence
        working-directory: command-api
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {randomBytes} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const sha=spawnSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).stdout.trim();
          if(!/^[a-f0-9]{40}$/.test(sha))throw Error('checkout SHA unresolved');
          const id=process.env.W025_NILE_CONTAINER_ID;
          const evidence={source_sha:sha,checkout_sha:sha,
            native_container:{verified:true,id,database:'jobsearch_dev',cleaned_up:false},
            runs:[],results:[]};
          let good=true;
          const run=(runId,mode,command,args,expected=[],kind='tap')=>{
            const challenge=mode==='NATIVE'?randomBytes(16).toString('hex'):null;
            const childEnv=mode==='NATIVE'?{
              ...process.env,W025_NATIVE_RUN_ID:runId,W025_NATIVE_CHALLENGE:challenge
            }:process.env;
            const child=spawnSync(command,args,{encoding:'utf8',env:childEnv,timeout:180000});
            const output=(child.stdout||'')+'\n'+(child.stderr||'');
            process.stdout.write(output);
            let sqlReadback=null;
            if(mode==='NATIVE'){
              const matches=[...output.matchAll(/(?:^|\n)(?:# )?W025_NATIVE_DB_READBACK=(\{[^\n]+\})/g)];
              if(matches.length===1){
                try{
                  const row=JSON.parse(matches[0][1]);
                  if(row.run===runId && row.challenge===challenge &&
                     row.db_name==='jobsearch_dev' &&
                     typeof row.principal==='string' && row.principal.trim() &&
                     Number.isInteger(row.backend_pid) && row.backend_pid>0 &&
                     row.server_port===5432)sqlReadback=row;
                }catch{/* malformed or spoofed evidence is a hard failure */}
              }
              if(!sqlReadback)good=false;
            }
            const subtests=[...output.matchAll(/^\s*# Subtest: (?:W025[- ]([A-Z][0-9]{1,2})|([DG]1):)/gm)]
              .map(m=>m[1]||m[2]);
            const pick=name=>Number(new RegExp('^# '+name+' (\\d+)$','m').exec(output)?.[1]??-1);
            const tap={tests:pick('tests'),passed:pick('pass'),failed:pick('fail'),
              skipped:pick('skipped'),todo:pick('todo'),cancelled:pick('cancelled'),
              complete:/^1\.\.\d+$/m.test(output)};
            let observed=[];
            if(kind==='migration' && output.includes('W025_MIGRATIONS_FIRST=PASS') &&
               output.includes('W025_MIGRATIONS_IDEMPOTENCE=PASS'))observed=['M01','M02'];
            else if(kind==='admission' && output.includes('W025_ADMISSION=PASS'))observed=['H01'];
            else if(kind==='provider' && child.status===0 && /EVIDENCE_COLLECTED/.test(output))observed=[];
            else if(kind==='unit_admission' && tap.failed===0 && tap.skipped===0 && tap.passed===tap.tests)observed=['H02'];
            else if(kind==='mock_composite' && tap.failed===0 && tap.skipped===0 && tap.passed===tap.tests)observed=['M04'];
            else if(kind==='tap')observed=subtests;
            // No expected ID can be inferred from filename, nor from a test that did not run.
            if(expected.some(x=>observed.filter(y=>x===y).length!==1) ||
               observed.some(x=>!expected.includes(x)))good=false;
            const exit_code=child.status??-1;
            if(exit_code!==0 || (kind!=='migration' && kind!=='provider' && (tap.tests<1 || tap.passed!==tap.tests ||
               tap.failed!==0 || tap.skipped!==0 || tap.todo!==0 ||
               tap.cancelled!==0 || !tap.complete)))good=false;
            evidence.runs.push({id:runId,mode,command:[command,...args].join(' '),
              exit_code,checkout_sha:sha,tap:kind==='migration'||kind==='provider'?null:tap,
              probe_verified:(kind==='migration'||kind==='provider')?exit_code===0:undefined,observed_ids:observed,
              ...(mode==='NATIVE'?{native_container_id:id,native_db_observed:Boolean(sqlReadback),
                native_challenge:challenge,native_db_readback:sqlReadback}:{})});
            for(const x of observed)evidence.results.push({id:x,status:'PASS',sha,run_id:runId});
          };
          run('migration','NATIVE','node',['scripts/db-nile-migrate-evidence.mjs'],['M01','M02'],'migration');
          const providerWrapper=[
            "import {spawnSync} from 'node:child_process';",
            "import {admitNileCi,attestNativeDatabase} from './scripts/nile-ci-local-admission.mjs';",
            "admitNileCi();",
            "const child=spawnSync(process.execPath,['scripts/db-nile-contract-evidence.mjs'],{env:process.env,encoding:'utf8',timeout:150000});",
            "process.stdout.write(child.stdout||'');process.stderr.write(child.stderr||'');",
            "if(child.status!==0)throw Error('Nile provider contract evidence failed');",
            "const {default:pg}=await import('pg');",
            "const pool=new pg.Pool({connectionString:process.env.NILE_TEST_DATABASE_URL,max:1});",
            "try{await attestNativeDatabase(pool);}finally{await pool.end();}"
          ].join('\n');
          run('provider','NATIVE','node',['--input-type=module','-e',providerWrapper],[],'provider');
          run('admission_unit','HARNESS','node',['--test','test/nile-ci-local-admission.test.mjs'],['H02'],'unit_admission');
          run('tenant','NATIVE','node',['--test','test/nile-native-isolation.integration.mjs'],['T01','T02','T03','T04','T05']);
          run('multiuser','NATIVE','node',['--test','test/multiuser-db.integration.mjs'],['U01','U02','U03','U04','U05','F01','F02','U06','L01','L02']);
          run('role_family','NATIVE','node',['--test','test/nile-role-family.integration.mjs'],['R01','R02','R03','R04','R05']);
          run('role_review','MOCK','node',['--test','test/role-family-review.test.mjs'],['D1','G1']);
          run('unit_all','MOCK','npm',['test'],['M04'],'mock_composite');
          // H01 is read back by an actual admission process (never from arbitrary logs).
          const admit=spawnSync('node',['scripts/nile-ci-local-admission.mjs'],{encoding:'utf8',env:process.env});
          const admitted=admit.status===0 && /^W025_ADMISSION=PASS /m.test(admit.stdout||'');
          if(!admitted)good=false;
          evidence.runs.push({id:'admission',mode:'HARNESS',command:'node scripts/nile-ci-local-admission.mjs',
            exit_code:admitted?0:1,checkout_sha:sha,probe_verified:admitted,tap:null,observed_ids:admitted?['H01']:[]});
          if(admitted)evidence.results.push({id:'H01',status:'PASS',sha,run_id:'admission'});
          const direct=spawnSync('node',['scripts/db-migrate.mjs'],{encoding:'utf8',env:process.env});
          const npm=spawnSync('npm',['run','db:migrate'],{encoding:'utf8',env:process.env});
          const refusal=direct.status===86 && npm.status!==0 &&
            (direct.stdout+direct.stderr).includes('JSCC541_DEV01B_MIGRATION_ENTRYPOINT_DISABLED') &&
            (npm.stdout+npm.stderr).includes('JSCC541_DEV01B_MIGRATION_ENTRYPOINT_DISABLED');
          if(!refusal)good=false;
          evidence.runs.push({id:'retired_entrypoint',mode:'HARNESS',command:'node scripts/db-migrate.mjs AND npm run db:migrate',
            exit_code:refusal?0:1,checkout_sha:sha,probe_verified:refusal,tap:null,observed_ids:refusal?['E86']:[]});
          if(refusal)evidence.results.push({id:'E86',status:'PASS',sha,run_id:'retired_entrypoint'});
          writeFileSync('/tmp/w025-nile-process-evidence.json',JSON.stringify(evidence,null,2));
          if(!good)process.exitCode=1;
          NODE
      - name: Nile container diagnostic and confirmed cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${W025_NILE_CONTAINER_ID:-}" ]; then
            docker logs "$W025_NILE_CONTAINER_ID" || true
            docker rm -f "$W025_NILE_CONTAINER_ID"
            ! docker inspect "$W025_NILE_CONTAINER_ID" >/dev/null 2>&1
          fi
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync,writeFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const file='/tmp/w025-nile-process-evidence.json';
          if(!existsSync(file))throw Error('Nile test evidence missing');
          const e=JSON.parse(readFileSync(file,'utf8'));
          const id=process.env.W025_NILE_CONTAINER_ID;
          if(!id || id!==e.native_container.id || !/^[a-f0-9]{64}$/.test(id))throw Error('container identity missing');
          const check=spawnSync('docker',['inspect',id],{encoding:'utf8'});
          if(check.status===0)throw Error('Docker container was not removed');
          e.native_container.cleaned_up=true;
          e.runs.push({id:'cleanup',mode:'HARNESS',command:'docker rm -f and inspect',exit_code:0,
            checkout_sha:e.source_sha,probe_verified:true,tap:null,observed_ids:['H03']});
          e.results.push({id:'H03',status:'PASS',sha:e.source_sha,run_id:'cleanup'});
          writeFileSync(file,JSON.stringify(e,null,2));
          NODE
      - name: Exact SHA mandatory 29-ID source and native gate
        if: always()
        working-directory: command-api
        run: node scripts/nile-ci-test-gate.mjs /tmp/w025-nile-process-evidence.json "$(git rev-parse HEAD)"

  w025-harness-only:
    name: W02-5 owner-authorized disposable harness only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ops/531-w025-harness-088e1e' && github.repository == 'Shosetzel69/job-search-command-center' && github.actor == 'Shosetzel69'
    permissions:
      contents: read
    uses: ./.github/workflows/w025-nile-harness-only.yml
