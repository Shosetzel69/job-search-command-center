name: Validate Command API

on:
  push:
    branches: [main]
    paths:
      - "command-api/**"
      - "frontend/**"
      - "scripts/**"
      - "shared/**"
      - "requirements-search.txt"
      - "data/sources.json"
      - "data/source-categories.json"
      - "data/nomenclatures.json"
      - "data/applications.json"
      - "data/search-config.json"
      - "data/run-history.json"
      - ".github/workflows/command-api-check.yml"
      - ".github/workflows/job-search-full.yml"
      - ".github/workflows/deploy-environment.yml"
      - ".github/workflows/ai-release-dispatch.yml"
      - ".github/workflows/record-test-pass.yml"
      - ".github/workflows/prod-cutover.yml"
      - "config/environments.json"
      - "config/prod-baseline-migration-332.json"
      - "config/provenance/prod-baseline-332/**"
      - "package.json"
  pull_request:
    paths:
      - "command-api/**"
      - "frontend/**"
      - "scripts/**"
      - "shared/**"
      - "requirements-search.txt"
      - "data/sources.json"
      - "data/source-categories.json"
      - "data/nomenclatures.json"
      - "data/applications.json"
      - "data/search-config.json"
      - "data/run-history.json"
      - ".github/workflows/command-api-check.yml"
      - ".github/workflows/job-search-full.yml"
      - ".github/workflows/deploy-environment.yml"
      - ".github/workflows/ai-release-dispatch.yml"
      - ".github/workflows/record-test-pass.yml"
      - ".github/workflows/prod-cutover.yml"
      - "config/environments.json"
      - "config/prod-baseline-migration-332.json"
      - "config/provenance/prod-baseline-332/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobsearch_dev
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobsearch_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate Python syntax and search configuration
        run: |
          python3 -m py_compile scripts/job_search.py scripts/job_search_optimized.py scripts/job_search_apify.py scripts/job_search_runner.py scripts/shared_corpus_repository.py scripts/shared_corpus_import.py scripts/source_orchestration.py scripts/job_search_public_boards.py scripts/job_search_softgarden.py scripts/job_search_eightfold_public.py scripts/job_search_web.py scripts/web_browser.py scripts/web_transport.py scripts/test_search_logic.py scripts/test_shared_corpus_repository.py scripts/role_taxonomy.py scripts/test_role_taxonomy.py
          bash -n scripts/multiuser-db-backup.sh scripts/multiuser-db-restore-verify.sh
          python3 - <<'PY'
          import json
          import sys
          sys.path.insert(0, "scripts")
          import job_search
          import job_search_runner

          config = job_search.load_config()
          assert job_search.configured_titles(config)
          assert job_search_runner.HISTORY_LIMIT == 10
          history = json.load(open("data/run-history.json", encoding="utf-8"))
          assert history.get("schema_version") == job_search.SCHEMA_VERSION
          assert isinstance(history.get("runs"), list)
          assert len(history["runs"]) <= 10
          print("Python modules, geography configuration and run history are valid")
          PY

      - name: Validate shared role taxonomy gate
        run: python3 scripts/role_taxonomy.py validate

      - name: Guard retired source-repository full search
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/job-search-full.yml').read_text(encoding='utf-8')
          assert 'workflow_dispatch:' in workflow, 'Retired workflow keeps an explicit manual tombstone'
          assert '\n  push:' not in workflow, 'Retired full search must not run on push'
          assert '\n  schedule:' not in workflow, 'Retired full search must not be scheduled'
          assert 'contents: read' in workflow and 'contents: write' not in workflow
          assert 'secrets.' not in workflow
          assert 'GITHUB_SOURCE_REPO_SEARCH_RETIRED' in workflow
          print('Source-repository full search is retired fail-closed; GCP Cloud Run Search Job is canonical')
          PY

      - name: Run search logic regression tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Verify backup restore refuses PROD
        run: |
          set +e
          RESTORE_DATABASE_URL="postgresql://runtime:x@localhost/jobsearch_prod" \
          BACKUP_FILE="/tmp/not-used.dump" \
          BACKUP_SHA256_FILE="/tmp/not-used.sha256" \
          bash scripts/multiuser-db-restore-verify.sh > /tmp/restore.out 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          grep -q "Refusing restore into PROD" /tmp/restore.out

      - name: Validate JSON contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("data/search-config.json"),
              Path("data/run-history.json"),
              Path("data/sources.json"),
              Path("data/source-categories.json"),
              Path("data/nomenclatures.json"),
              Path("data/applications.json"),
          ]
          payloads = {}
          for path in paths:
              payloads[path.name] = json.loads(path.read_text(encoding="utf-8"))
              print(f"valid JSON: {path}")

          assert payloads["sources.json"].get("schema_version") == "1.0"
          assert payloads["applications.json"].get("schema_version") == "1.0"

          categories = payloads["source-categories.json"]
          assert categories.get("schema_version") == "1.0"
          assert categories.get("count") == len(categories.get("categories", []))
          labels = [str(item.get("label", "")).strip().casefold() for item in categories.get("categories", [])]
          assert all(labels) and len(labels) == len(set(labels))

          nomenclatures = payloads["nomenclatures.json"]
          assert nomenclatures.get("schema_version") == "1.0"
          domains = nomenclatures.get("domains") or {}
          required_domains = {
              "regions", "countries", "work_modes", "contract_types",
              "application_statuses", "seniority",
          }
          assert set(domains) == required_domains
          for domain_name, domain in domains.items():
              assert domain.get("kind") in {"system", "extensible"}, domain_name
              assert isinstance(domain.get("extensible"), bool), domain_name
              assert (domain.get("kind") == "extensible") == domain.get("extensible"), domain_name
              values = domain.get("values")
              assert isinstance(values, list), domain_name
              codes = [str(item.get("code", "")).strip() for item in values]
              labels = [str(item.get("label", "")).strip().casefold() for item in values]
              assert all(codes) and len(codes) == len(set(codes)), domain_name
              assert all(labels) and len(labels) == len(set(labels)), domain_name
              for item in values:
                  assert isinstance(item.get("active"), bool), (domain_name, item)
                  assert isinstance(item.get("sort_order"), int), (domain_name, item)

          countries = {item["code"] for item in domains["countries"]["values"]}
          regions = {item["code"]: item for item in domains["regions"]["values"]}
          assert set(regions) == {"EU", "US", "ASIA"}
          assert regions["EU"]["label"] == "Uniunea Europeana"
          for region in regions.values():
              members = region.get("country_codes") or []
              assert members and len(members) == len(set(members))
              assert set(members) <= countries

          work_modes = {item["code"] for item in domains["work_modes"]["values"]}
          assert work_modes == {"remote", "hybrid", "onsite"}
          contract_types = {item["code"] for item in domains["contract_types"]["values"]}
          assert contract_types == {"permanent", "temporary", "contract", "freelance"}
          application_statuses = {item["code"] for item in domains["application_statuses"]["values"]}
          assert "applied" in application_statuses
          assert domains["seniority"]["values"] == []

          print("Package 2A/2A8 data contracts are versioned and consistent")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run environment automation tests
        run: npm run test:environment

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Install Worker dependencies
        working-directory: command-api
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Provision ephemeral PostgreSQL roles
        working-directory: command-api
        run: |
          node --input-type=module - <<'NODE'
          import pg from 'pg';
          const { Client } = pg;
          const client = new Client({ connectionString:'postgresql://postgres:postgres@localhost:5432/jobsearch_dev' });
          await client.connect();
          await client.query("CREATE ROLE jscc_migration LOGIN PASSWORD 'migration' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE");
          await client.query("CREATE ROLE jscc_runtime LOGIN PASSWORD 'runtime' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT");
          await client.query('ALTER DATABASE jobsearch_dev OWNER TO jscc_migration');
          await client.query('ALTER SCHEMA public OWNER TO jscc_migration');
          await client.end();
          NODE

      - name: Validate ADR-008 tenant boundary
        working-directory: command-api
        run: npm run check:tenant-boundary

      - name: Run Multiuser PostgreSQL integration tests
        working-directory: command-api
        env:
          APP_ENV: dev
          NILE_DATABASE_URL: postgresql://jscc_runtime:runtime@localhost:5432/jobsearch_dev
          NILE_MIGRATION_DATABASE_URL: postgresql://jscc_migration:migration@localhost:5432/jobsearch_dev
          JSCC_INTEGRATION_DATABASE_URL: postgresql://jscc_runtime:runtime@localhost:5432/jobsearch_dev
          JSCC_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobsearch_dev
          JSCC_MAX_USERS: "50"
          BOOTSTRAP_ADMIN_GOOGLE_SUB: owner-sub
        run: |
          npm run db:migrate
          npm run db:nile-tenant-probe
          npm run db:provision-runtime
          npm run db:privilege-readiness
          node --test test/multiuser-db.integration.mjs

      - name: Run Command API unit tests
        working-directory: command-api
        run: npm test

      - name: Validate React frontend and Worker build
        working-directory: command-api
        run: npm run check


  nile-contract-evidence:
    name: Nile provider contract evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Command API dependencies
        working-directory: command-api
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Start official Nile testing container
        run: |
          docker pull ghcr.io/niledatabase/testingcontainer:latest
          docker run --rm -d \
            --name jscc-nile-test \
            -p 55432:5432 \
            ghcr.io/niledatabase/testingcontainer:latest

          ready=0
          for i in $(seq 1 90); do
            if docker logs jscc-nile-test 2>&1 | grep -q "Database has been created and is ready"; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs jscc-nile-test
            exit 1
          fi

      - name: Apply migrations on official Nile testing container
        working-directory: command-api
        env:
          NILE_TEST_DATABASE_URL: postgresql://00000000-0000-0000-0000-000000000000:password@localhost:55432/test
        run: npm run db:nile-migrate-evidence

      - name: Collect Nile provider contract evidence
        working-directory: command-api
        env:
          NILE_TEST_DATABASE_URL: postgresql://00000000-0000-0000-0000-000000000000:password@localhost:55432/test
        run: npm run db:nile-contract-evidence

      - name: Show Nile container logs
        if: always()
        run: docker logs jscc-nile-test || true

      - name: Stop Nile testing container
        if: always()
        run: docker stop jscc-nile-test || true
