name: Validate Command API

on:
  push:
    branches: [main]
    paths:
      - "command-api/**"
      - ".github/workflows/command-api-check.yml"
  pull_request:
    paths:
      - "command-api/**"
      - ".github/workflows/command-api-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned dependencies
        working-directory: command-api
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Worker build
        working-directory: command-api
        run: npm run check
