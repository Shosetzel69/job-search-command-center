name: Phase 3 161 integration

on:
  push:
    branches:
      - feat/161-phase3-environment-automation

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/161-phase3-environment-automation
          fetch-depth: 0

      - name: Apply Phase 3 documentation and CI integration
        run: python3 scripts/apply_phase3_docs.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run search regressions
        run: |
          python3 -m py_compile scripts/job_search.py scripts/job_search_optimized.py scripts/job_search_apify.py scripts/job_search_runner.py scripts/source_orchestration.py scripts/job_search_web.py scripts/web_browser.py scripts/web_transport.py
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Environment automation tests
        run: npm run test:environment

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test

      - name: Command API tests and Wrangler dry-run
        working-directory: command-api
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run check

      - name: Commit validated Phase 3 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase3-161-apply.yml scripts/apply_phase3_docs.py
          git add ARCHITECTURE.md CONTRIBUTING.md CHANGELOG.md docs/environment-provisioning-runbook.md docs/command-api.md .github/workflows/command-api-check.yml config/environments.json package.json scripts/environment.mjs scripts/environment scripts/test_environment.mjs .github/workflows/deploy-environment.yml
          git diff --cached --check
          git commit -m '[FEAT][#161] Complete Phase 3 environment automation'
          git push origin HEAD:feat/161-phase3-environment-automation
