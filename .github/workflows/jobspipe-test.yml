name: JobsPipe connection test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jobspipe-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-jobspipe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Query one recent matching job
        env:
          JOBSPIPE_API_KEY: ${{ secrets.JOBSPIPE_API_KEY }}
        run: |
          test -n "$JOBSPIPE_API_KEY"
          mkdir -p data
          curl --fail-with-body --silent --show-error \
            https://api.jobspipe.dev/v1/jobs/search \
            -H "Authorization: Bearer $JOBSPIPE_API_KEY" \
            -H "Content-Type: application/json" \
            --data '{"job_title_or":["Project Manager","IT Project Manager","Technical Project Manager","Delivery Manager","Service Manager","Scrum Master"],"posted_at_max_age_days":1,"limit":1,"include_total_results":true}' \
            > data/jobspipe-test.json
          jq -e '.data | type == "array"' data/jobspipe-test.json >/dev/null

      - name: Save test result
        run: |
          git config user.name "job-search-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobspipe-test.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "Test JobsPipe connection"
            git push
          fi
