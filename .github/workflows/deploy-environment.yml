name: Environment automation

on:
  workflow_dispatch:
    inputs:
      action:
        description: Environment automation action
        required: true
        type: choice
        options: [validate, bootstrap, deploy, status, isolation-test]
      environment:
        description: Explicit target environment
        required: true
        type: choice
        options: [dev, test, prod]
      source_sha:
        description: Immutable source commit SHA
        required: true
        type: string
      dry_run:
        description: Non-mutating validation/plan
        required: true
        default: true
        type: boolean
      owner_gate:
        description: Must be APPROVED for any PROD gated operation
        required: false
        type: string

permissions:
  contents: read

jobs:
  environment-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Guard immutable source and Phase 4 live scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.source_sha }}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_sha must be a full immutable commit SHA" >&2; exit 1; }
          actual="$(git rev-parse HEAD)"
          test "${actual,,}" = "${{ inputs.source_sha }}" || { echo "checkout does not match source_sha" >&2; exit 1; }
          if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.environment }}" != "dev" ]; then
            echo "Phase 4 live execution is DEV-only" >&2
            exit 1
          fi
          if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.action }}" = "isolation-test" ]; then
            echo "Provider isolation verification is reserved for independent G4 QA; development runs only the static isolation contract" >&2
            exit 1
          fi
          if [ "${{ inputs.environment }}" = "prod" ] && [ "${{ inputs.owner_gate }}" != "APPROVED" ]; then
            echo "PROD requires explicit owner gate even for validation" >&2
            exit 1
          fi

      - name: Run environment contract tests
        run: npm run test:environment

      - name: Execute dry-run / static validation
        if: ${{ inputs.dry_run == true }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEV_CLOUDFLARE_ACCOUNT_ID: "11111111111111111111111111111111"
          TEST_CLOUDFLARE_ACCOUNT_ID: "22222222222222222222222222222222"
          PROD_CLOUDFLARE_ACCOUNT_ID: "33333333333333333333333333333333"
          DEV_CLOUDFLARE_TOKEN: dry-run-dev-cf
          TEST_CLOUDFLARE_TOKEN: dry-run-test-cf
          PROD_CLOUDFLARE_TOKEN: dry-run-prod-cf
          DEV_GITHUB_RUNTIME_TOKEN: dry-run-dev-gh
          TEST_GITHUB_RUNTIME_TOKEN: dry-run-test-gh
          PROD_GITHUB_RUNTIME_TOKEN: dry-run-prod-gh
          DEV_SOURCE_READ_TOKEN: dry-run-dev-source
          TEST_SOURCE_READ_TOKEN: dry-run-test-source
          PROD_SOURCE_READ_TOKEN: dry-run-prod-source
          DEV_ALLOWED_GOOGLE_SUB: dry-run-dev-sub
          TEST_ALLOWED_GOOGLE_SUB: dry-run-test-sub
          PROD_ALLOWED_GOOGLE_SUB: dry-run-prod-sub
          DEV_GOOGLE_CLIENT_ID: dry-run-dev.apps.googleusercontent.com
          TEST_GOOGLE_CLIENT_ID: dry-run-test.apps.googleusercontent.com
          PROD_GOOGLE_CLIENT_ID: dry-run-prod.apps.googleusercontent.com
          DEV_FRONTEND_ORIGIN: https://dev.example.invalid
          TEST_FRONTEND_ORIGIN: https://test.example.invalid
          PROD_FRONTEND_ORIGIN: https://prod.example.invalid
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "${{ inputs.environment }}" = "prod" ]; then EXTRA+=(--owner-gate "${{ inputs.owner_gate }}"); fi
          case "${{ inputs.action }}" in
            validate) npm run env:validate -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run "${EXTRA[@]}" ;;
            bootstrap) npm run env:bootstrap -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run "${EXTRA[@]}" ;;
            deploy) npm run env:deploy -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run "${EXTRA[@]}" ;;
            status) npm run env:status -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run ;;
            isolation-test) npm run env:isolation-test -- --source-sha "$SOURCE_SHA" --dry-run ;;
            *) echo "Unsupported action" >&2; exit 1 ;;
          esac

      - name: Install Command API deployment dependencies
        if: ${{ inputs.dry_run == false && inputs.environment == 'dev' && (inputs.action == 'bootstrap' || inputs.action == 'deploy') }}
        run: npm --prefix command-api install --ignore-scripts --no-audit --no-fund

      - name: Execute live DEV action
        if: ${{ inputs.dry_run == false && inputs.environment == 'dev' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEV_CLOUDFLARE_ACCOUNT_ID: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_ID }}
          DEV_CLOUDFLARE_TOKEN: ${{ secrets.DEV_CLOUDFLARE_TOKEN }}
          DEV_GITHUB_RUNTIME_TOKEN: ${{ secrets.DEV_GITHUB_RUNTIME_TOKEN }}
          DEV_SOURCE_READ_TOKEN: ${{ secrets.DEV_SOURCE_READ_TOKEN }}
          DEV_ALLOWED_GOOGLE_SUB: ${{ secrets.DEV_ALLOWED_GOOGLE_SUB }}
          DEV_GOOGLE_CLIENT_ID: ${{ vars.DEV_GOOGLE_CLIENT_ID }}
          DEV_FRONTEND_ORIGIN: ${{ vars.DEV_FRONTEND_ORIGIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEV_CLOUDFLARE_TOKEN }}
          GH_TOKEN: ${{ secrets.BOOTSTRAP_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.action }}" in
            validate) npm run env:validate -- --env dev --source-sha "$SOURCE_SHA" ;;
            bootstrap) npm run env:bootstrap -- --env dev --source-sha "$SOURCE_SHA" ;;
            deploy) npm run env:deploy -- --env dev --source-sha "$SOURCE_SHA" ;;
            status) npm run env:status -- --env dev --source-sha "$SOURCE_SHA" ;;
            isolation-test) echo "Use independent G4 QA for provider isolation" >&2; exit 1 ;;
            *) echo "Unsupported action" >&2; exit 1 ;;
          esac

      - name: Configure DEV runtime/Worker secrets
        if: ${{ inputs.dry_run == false && inputs.environment == 'dev' && inputs.action == 'bootstrap' }}
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_GITHUB_TOKEN }}
          SOURCE_READ_TOKEN: ${{ secrets.DEV_SOURCE_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEV_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_ID }}
          RUNTIME_TOKEN: ${{ secrets.DEV_GITHUB_RUNTIME_TOKEN }}
          ALLOWED_GOOGLE_SUB: ${{ secrets.DEV_ALLOWED_GOOGLE_SUB }}
        shell: bash
        working-directory: command-api
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_READ_TOKEN" | gh secret set SOURCE_READ_TOKEN --repo Shosetzel69/job-search-runtime-dev
          printf '%s' "$RUNTIME_TOKEN" | npx wrangler secret put GITHUB_TOKEN --name job-search-command-api
          printf '%s' "$ALLOWED_GOOGLE_SUB" | npx wrangler secret put ALLOWED_GOOGLE_SUB --name job-search-command-api

      - name: Verify DEV credential roles and final health
        if: ${{ inputs.dry_run == false && inputs.environment == 'dev' && inputs.action == 'bootstrap' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEV_CLOUDFLARE_ACCOUNT_ID: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_ID }}
          DEV_CLOUDFLARE_TOKEN: ${{ secrets.DEV_CLOUDFLARE_TOKEN }}
          DEV_GITHUB_RUNTIME_TOKEN: ${{ secrets.DEV_GITHUB_RUNTIME_TOKEN }}
          DEV_SOURCE_READ_TOKEN: ${{ secrets.DEV_SOURCE_READ_TOKEN }}
          DEV_ALLOWED_GOOGLE_SUB: ${{ secrets.DEV_ALLOWED_GOOGLE_SUB }}
          DEV_GOOGLE_CLIENT_ID: ${{ vars.DEV_GOOGLE_CLIENT_ID }}
          DEV_FRONTEND_ORIGIN: ${{ vars.DEV_FRONTEND_ORIGIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEV_CLOUDFLARE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_permission="$(GH_TOKEN="$DEV_GITHUB_RUNTIME_TOKEN" gh repo view Shosetzel69/job-search-runtime-dev --json viewerPermission --jq .viewerPermission)"
          case "$runtime_permission" in WRITE|MAINTAIN|ADMIN) ;; *) echo "DEV runtime token lacks runtime write permission" >&2; exit 1 ;; esac
          source_permission="$(GH_TOKEN="$DEV_GITHUB_RUNTIME_TOKEN" gh repo view Shosetzel69/job-search-command-center --json viewerPermission --jq .viewerPermission 2>/dev/null || echo NONE)"
          case "$source_permission" in WRITE|MAINTAIN|ADMIN) echo "DEV runtime token must not have source write permission" >&2; exit 1 ;; esac
          GH_TOKEN="$DEV_SOURCE_READ_TOKEN" gh api "repos/Shosetzel69/job-search-command-center/commits/$SOURCE_SHA" --silent
          npm run env:status -- --env dev --source-sha "$SOURCE_SHA"
