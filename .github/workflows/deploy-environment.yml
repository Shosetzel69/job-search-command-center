name: Environment automation

on:
  workflow_dispatch:
    inputs:
      action:
        description: Environment automation action
        required: true
        type: choice
        options: [validate, bootstrap, deploy, status, isolation-test, prod-preflight]
      environment:
        description: Explicit target environment
        required: true
        type: choice
        options: [dev, test, prod]
      source_sha:
        description: Immutable source commit SHA
        required: true
        type: string
      dry_run:
        description: Non-mutating validation/plan
        required: true
        default: true
        type: boolean
      owner_gate:
        description: Defense-in-depth confirmation for PROD preparation
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Guard immutable source and Phase 6 scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.source_sha }}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_sha must be a full immutable commit SHA" >&2; exit 1; }
          if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.environment }}" = "prod" ]; then
            echo "Phase 6 permits PROD preparation only; live PROD execution remains blocked until separate Phase 7 GO" >&2
            exit 1
          fi
          if [ "${{ inputs.action }}" = "prod-preflight" ] && [ "${{ inputs.environment }}" != "prod" ]; then
            echo "prod-preflight requires environment=prod" >&2
            exit 1
          fi
          if [ "${{ inputs.action }}" = "prod-preflight" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "prod-preflight is non-mutating and requires dry_run=true" >&2
            exit 1
          fi
          if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.action }}" = "isolation-test" ]; then
            echo "Provider isolation verification is reserved for independent QA; development runs only the static isolation contract" >&2
            exit 1
          fi
          if [ "${{ inputs.environment }}" = "prod" ] && [ "${{ inputs.owner_gate }}" != "APPROVED" ]; then
            echo "PROD preparation requires explicit owner confirmation" >&2
            exit 1
          fi

      - name: Run environment contract tests
        run: npm run test:environment

      - name: Execute dry-run / static validation
        if: ${{ inputs.dry_run == true }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEV_CLOUDFLARE_ACCOUNT_ID: "11111111111111111111111111111111"
          TEST_CLOUDFLARE_ACCOUNT_ID: "22222222222222222222222222222222"
          PROD_CLOUDFLARE_ACCOUNT_ID: "33333333333333333333333333333333"
          DEV_CLOUDFLARE_TOKEN: dry-run-dev-cf
          TEST_CLOUDFLARE_TOKEN: dry-run-test-cf
          PROD_CLOUDFLARE_TOKEN: dry-run-prod-cf
          DEV_GITHUB_BOOTSTRAP_TOKEN: dry-run-dev-bootstrap
          TEST_GITHUB_BOOTSTRAP_TOKEN: dry-run-test-bootstrap
          PROD_GITHUB_BOOTSTRAP_TOKEN: dry-run-prod-bootstrap
          DEV_GITHUB_RUNTIME_TOKEN: dry-run-dev-runtime
          TEST_GITHUB_RUNTIME_TOKEN: dry-run-test-runtime
          PROD_GITHUB_RUNTIME_TOKEN: dry-run-prod-runtime
          DEV_SOURCE_READ_TOKEN: dry-run-dev-source
          TEST_SOURCE_READ_TOKEN: dry-run-test-source
          PROD_SOURCE_READ_TOKEN: dry-run-prod-source
          DEV_ALLOWED_GOOGLE_SUB: dry-run-dev-sub
          TEST_ALLOWED_GOOGLE_SUB: dry-run-test-sub
          PROD_ALLOWED_GOOGLE_SUB: dry-run-prod-sub
          DEV_GOOGLE_CLIENT_ID: dry-run-dev.apps.googleusercontent.com
          TEST_GOOGLE_CLIENT_ID: dry-run-test.apps.googleusercontent.com
          PROD_GOOGLE_CLIENT_ID: dry-run-prod.apps.googleusercontent.com
          DEV_FRONTEND_ORIGIN: https://dev.example.invalid
          TEST_FRONTEND_ORIGIN: https://test.example.invalid
          PROD_FRONTEND_ORIGIN: https://prod.example.invalid
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "${{ inputs.environment }}" = "prod" ]; then EXTRA+=(--owner-gate "${{ inputs.owner_gate }}"); fi
          case "${{ inputs.action }}" in
            validate) npm run env:validate -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run "${EXTRA[@]}" ;;
            bootstrap) npm run env:bootstrap -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run "${EXTRA[@]}" ;;
            deploy) npm run env:deploy -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run "${EXTRA[@]}" ;;
            status) npm run env:status -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run ;;
            isolation-test) npm run env:isolation-test -- --source-sha "$SOURCE_SHA" --dry-run ;;
            prod-preflight) npm run env:prod-preflight -- --source-sha "$SOURCE_SHA" --dry-run --owner-gate "${{ inputs.owner_gate }}" ;;
            *) echo "Unsupported action" >&2; exit 1 ;;
          esac

  live-environment:
    if: ${{ inputs.dry_run == false && (inputs.environment == 'dev' || inputs.environment == 'test') }}
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout trusted control-plane from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: control-plane

      - name: Checkout immutable candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          path: candidate-source

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify trusted control-plane and approved candidate ancestry
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ inputs.source_sha }}"
          candidate="$(git -C candidate-source rev-parse HEAD)"
          test "${candidate,,}" = "${source_sha,,}" || { echo "candidate checkout does not match source_sha" >&2; exit 1; }
          git -C control-plane fetch origin main --quiet
          git -C control-plane cat-file -e "${source_sha}^{commit}"
          git -C control-plane merge-base --is-ancestor "$source_sha" origin/main || {
            echo "Live deployment source_sha must already be reachable from trusted main" >&2
            exit 1
          }

      - name: Run trusted environment contract tests
        working-directory: control-plane
        run: npm run test:environment

      - name: Install trusted deployment dependencies
        if: ${{ inputs.action == 'bootstrap' }}
        run: npm --prefix control-plane/command-api install --ignore-scripts --no-audit --no-fund

      - name: Install candidate deployment dependencies without environment credentials
        if: ${{ inputs.action == 'bootstrap' || inputs.action == 'deploy' }}
        run: npm --prefix candidate-source/command-api install --ignore-scripts --no-audit --no-fund

      - name: Execute selected live environment action
        working-directory: control-plane
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_WORKSPACE: ${{ github.workspace }}/candidate-source
          DEV_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.environment == 'dev' && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          TEST_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.environment == 'test' && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          DEV_CLOUDFLARE_TOKEN: ${{ inputs.environment == 'dev' && secrets.CLOUDFLARE_TOKEN || '' }}
          TEST_CLOUDFLARE_TOKEN: ${{ inputs.environment == 'test' && secrets.CLOUDFLARE_TOKEN || '' }}
          DEV_GITHUB_BOOTSTRAP_TOKEN: ${{ inputs.environment == 'dev' && secrets.GH_BOOTSTRAP_TOKEN || '' }}
          TEST_GITHUB_BOOTSTRAP_TOKEN: ${{ inputs.environment == 'test' && secrets.GH_BOOTSTRAP_TOKEN || '' }}
          DEV_GITHUB_RUNTIME_TOKEN: ${{ inputs.environment == 'dev' && secrets.GH_RUNTIME_TOKEN || '' }}
          TEST_GITHUB_RUNTIME_TOKEN: ${{ inputs.environment == 'test' && secrets.GH_RUNTIME_TOKEN || '' }}
          DEV_SOURCE_READ_TOKEN: ${{ inputs.environment == 'dev' && secrets.SOURCE_READ_TOKEN || '' }}
          TEST_SOURCE_READ_TOKEN: ${{ inputs.environment == 'test' && secrets.SOURCE_READ_TOKEN || '' }}
          DEV_ALLOWED_GOOGLE_SUB: ${{ inputs.environment == 'dev' && secrets.ALLOWED_GOOGLE_SUB || '' }}
          TEST_ALLOWED_GOOGLE_SUB: ${{ inputs.environment == 'test' && secrets.ALLOWED_GOOGLE_SUB || '' }}
          DEV_GOOGLE_CLIENT_ID: ${{ inputs.environment == 'dev' && vars.GOOGLE_CLIENT_ID || '' }}
          TEST_GOOGLE_CLIENT_ID: ${{ inputs.environment == 'test' && vars.GOOGLE_CLIENT_ID || '' }}
          DEV_FRONTEND_ORIGIN: ${{ inputs.environment == 'dev' && vars.FRONTEND_ORIGIN || '' }}
          TEST_FRONTEND_ORIGIN: ${{ inputs.environment == 'test' && vars.FRONTEND_ORIGIN || '' }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.action }}" in
            validate) npm run env:validate -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" ;;
            bootstrap) npm run env:bootstrap -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" ;;
            deploy) npm run env:deploy -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" ;;
            status) npm run env:status -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" ;;
            isolation-test) echo "Use independent QA for provider isolation" >&2; exit 1 ;;
            prod-preflight) echo "prod-preflight is dry-run only" >&2; exit 1 ;;
            *) echo "Unsupported action" >&2; exit 1 ;;
          esac

      - name: Configure runtime and Worker secrets with separated roles
        if: ${{ inputs.action == 'bootstrap' }}
        working-directory: control-plane/command-api
        env:
          SELECTED_CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SELECTED_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          SELECTED_GITHUB_BOOTSTRAP_TOKEN: ${{ secrets.GH_BOOTSTRAP_TOKEN }}
          SELECTED_GITHUB_RUNTIME_TOKEN: ${{ secrets.GH_RUNTIME_TOKEN }}
          SELECTED_SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          SELECTED_ALLOWED_GOOGLE_SUB: ${{ secrets.ALLOWED_GOOGLE_SUB }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.environment }}" in
            dev) runtime_repo="Shosetzel69/job-search-runtime-dev" ;;
            test) runtime_repo="Shosetzel69/job-search-runtime-test" ;;
            *) echo "Unsupported pre-cutover live environment" >&2; exit 1 ;;
          esac
          test "$SELECTED_GITHUB_BOOTSTRAP_TOKEN" != "$SELECTED_GITHUB_RUNTIME_TOKEN" || { echo "bootstrap/runtime token reuse is forbidden" >&2; exit 1; }
          printf '%s' "$SELECTED_SOURCE_READ_TOKEN" | GH_TOKEN="$SELECTED_GITHUB_BOOTSTRAP_TOKEN" gh secret set SOURCE_READ_TOKEN --repo "$runtime_repo"
          printf '%s' "$SELECTED_GITHUB_RUNTIME_TOKEN" | CLOUDFLARE_ACCOUNT_ID="$SELECTED_CLOUDFLARE_ACCOUNT_ID" CLOUDFLARE_API_TOKEN="$SELECTED_CLOUDFLARE_TOKEN" npx wrangler secret put GITHUB_TOKEN --name job-search-command-api
          printf '%s' "$SELECTED_ALLOWED_GOOGLE_SUB" | CLOUDFLARE_ACCOUNT_ID="$SELECTED_CLOUDFLARE_ACCOUNT_ID" CLOUDFLARE_API_TOKEN="$SELECTED_CLOUDFLARE_TOKEN" npx wrangler secret put ALLOWED_GOOGLE_SUB --name job-search-command-api

      - name: Verify credential role separation and final health
        if: ${{ inputs.action == 'bootstrap' }}
        working-directory: control-plane
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SELECTED_GITHUB_BOOTSTRAP_TOKEN: ${{ secrets.GH_BOOTSTRAP_TOKEN }}
          SELECTED_GITHUB_RUNTIME_TOKEN: ${{ secrets.GH_RUNTIME_TOKEN }}
          SELECTED_SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          DEV_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.environment == 'dev' && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          TEST_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.environment == 'test' && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          DEV_CLOUDFLARE_TOKEN: ${{ inputs.environment == 'dev' && secrets.CLOUDFLARE_TOKEN || '' }}
          TEST_CLOUDFLARE_TOKEN: ${{ inputs.environment == 'test' && secrets.CLOUDFLARE_TOKEN || '' }}
          DEV_GITHUB_BOOTSTRAP_TOKEN: ${{ inputs.environment == 'dev' && secrets.GH_BOOTSTRAP_TOKEN || '' }}
          TEST_GITHUB_BOOTSTRAP_TOKEN: ${{ inputs.environment == 'test' && secrets.GH_BOOTSTRAP_TOKEN || '' }}
          DEV_GITHUB_RUNTIME_TOKEN: ${{ inputs.environment == 'dev' && secrets.GH_RUNTIME_TOKEN || '' }}
          TEST_GITHUB_RUNTIME_TOKEN: ${{ inputs.environment == 'test' && secrets.GH_RUNTIME_TOKEN || '' }}
          DEV_SOURCE_READ_TOKEN: ${{ inputs.environment == 'dev' && secrets.SOURCE_READ_TOKEN || '' }}
          TEST_SOURCE_READ_TOKEN: ${{ inputs.environment == 'test' && secrets.SOURCE_READ_TOKEN || '' }}
          DEV_ALLOWED_GOOGLE_SUB: ${{ inputs.environment == 'dev' && secrets.ALLOWED_GOOGLE_SUB || '' }}
          TEST_ALLOWED_GOOGLE_SUB: ${{ inputs.environment == 'test' && secrets.ALLOWED_GOOGLE_SUB || '' }}
          DEV_GOOGLE_CLIENT_ID: ${{ inputs.environment == 'dev' && vars.GOOGLE_CLIENT_ID || '' }}
          TEST_GOOGLE_CLIENT_ID: ${{ inputs.environment == 'test' && vars.GOOGLE_CLIENT_ID || '' }}
          DEV_FRONTEND_ORIGIN: ${{ inputs.environment == 'dev' && vars.FRONTEND_ORIGIN || '' }}
          TEST_FRONTEND_ORIGIN: ${{ inputs.environment == 'test' && vars.FRONTEND_ORIGIN || '' }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.environment }}" in
            dev) runtime_repo="Shosetzel69/job-search-runtime-dev" ;;
            test) runtime_repo="Shosetzel69/job-search-runtime-test" ;;
            *) exit 1 ;;
          esac
          test "$SELECTED_GITHUB_BOOTSTRAP_TOKEN" != "$SELECTED_GITHUB_RUNTIME_TOKEN" || { echo "bootstrap/runtime token reuse is forbidden" >&2; exit 1; }
          runtime_permission="$(GH_TOKEN="$SELECTED_GITHUB_RUNTIME_TOKEN" gh repo view "$runtime_repo" --json viewerPermission --jq .viewerPermission)"
          case "$runtime_permission" in WRITE|MAINTAIN|ADMIN) ;; *) echo "Runtime token lacks runtime write permission" >&2; exit 1 ;; esac
          source_runtime_permission="$(GH_TOKEN="$SELECTED_GITHUB_RUNTIME_TOKEN" gh repo view Shosetzel69/job-search-command-center --json viewerPermission --jq .viewerPermission 2>/dev/null || echo NONE)"
          case "$source_runtime_permission" in WRITE|MAINTAIN|ADMIN) echo "Runtime token must not have source write permission" >&2; exit 1 ;; esac
          source_permission="$(GH_TOKEN="$SELECTED_SOURCE_READ_TOKEN" gh repo view Shosetzel69/job-search-command-center --json viewerPermission --jq .viewerPermission)"
          case "$source_permission" in READ|TRIAGE) ;; *) echo "Source token must remain read-only" >&2; exit 1 ;; esac
          GH_TOKEN="$SELECTED_SOURCE_READ_TOKEN" gh api "repos/Shosetzel69/job-search-command-center/commits/$SOURCE_SHA" --silent
          for attempt in 1 2 3 4 5 6; do
            if npm run env:status -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA"; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Readiness did not converge after 30 seconds" >&2
              exit 1
            fi
            sleep 5
          done
