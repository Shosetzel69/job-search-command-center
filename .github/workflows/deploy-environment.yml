name: Environment automation

on:
  workflow_dispatch:
    inputs:
      action:
        description: Environment automation action
        required: true
        type: choice
        options: [validate, bootstrap, deploy, status, isolation-test, prod-preflight]
      environment:
        description: Explicit target environment
        required: true
        type: choice
        options: [dev, test, prod]
      source_sha:
        description: Immutable source commit SHA
        required: true
        type: string
      dry_run:
        description: Non-mutating validation/plan
        required: true
        default: true
        type: boolean
      owner_gate:
        description: Must be APPROVED for any PROD gated operation
        required: false
        type: string

permissions:
  contents: read

jobs:
  environment-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Guard immutable source and pre-cutover live scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.source_sha }}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_sha must be a full immutable commit SHA" >&2; exit 1; }
          actual="$(git rev-parse HEAD)"
          test "${actual,,}" = "${{ inputs.source_sha }}" || { echo "checkout does not match source_sha" >&2; exit 1; }
          if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.environment }}" = "prod" ]; then
            echo "Phase 6 permits PROD preparation only; live PROD execution remains blocked until separate Phase 7 GO" >&2
            exit 1
          fi
          if [ "${{ inputs.action }}" = "prod-preflight" ] && [ "${{ inputs.environment }}" != "prod" ]; then
            echo "prod-preflight requires environment=prod" >&2
            exit 1
          fi
          if [ "${{ inputs.action }}" = "prod-preflight" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "prod-preflight is non-mutating and requires dry_run=true" >&2
            exit 1
          fi
          if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.action }}" = "isolation-test" ]; then
            echo "Provider isolation verification is reserved for independent QA; development runs only the static isolation contract" >&2
            exit 1
          fi
          if [ "${{ inputs.environment }}" = "prod" ] && [ "${{ inputs.owner_gate }}" != "APPROVED" ]; then
            echo "PROD requires explicit owner gate even for validation/preparation" >&2
            exit 1
          fi

      - name: Run environment contract tests
        run: npm run test:environment

      - name: Execute dry-run / static validation
        if: ${{ inputs.dry_run == true }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEV_CLOUDFLARE_ACCOUNT_ID: "11111111111111111111111111111111"
          TEST_CLOUDFLARE_ACCOUNT_ID: "22222222222222222222222222222222"
          PROD_CLOUDFLARE_ACCOUNT_ID: "33333333333333333333333333333333"
          DEV_CLOUDFLARE_TOKEN: dry-run-dev-cf
          TEST_CLOUDFLARE_TOKEN: dry-run-test-cf
          PROD_CLOUDFLARE_TOKEN: dry-run-prod-cf
          DEV_GITHUB_RUNTIME_TOKEN: dry-run-dev-gh
          TEST_GITHUB_RUNTIME_TOKEN: dry-run-test-gh
          PROD_GITHUB_RUNTIME_TOKEN: dry-run-prod-gh
          DEV_SOURCE_READ_TOKEN: dry-run-dev-source
          TEST_SOURCE_READ_TOKEN: dry-run-test-source
          PROD_SOURCE_READ_TOKEN: dry-run-prod-source
          DEV_ALLOWED_GOOGLE_SUB: dry-run-dev-sub
          TEST_ALLOWED_GOOGLE_SUB: dry-run-test-sub
          PROD_ALLOWED_GOOGLE_SUB: dry-run-prod-sub
          DEV_GOOGLE_CLIENT_ID: dry-run-dev.apps.googleusercontent.com
          TEST_GOOGLE_CLIENT_ID: dry-run-test.apps.googleusercontent.com
          PROD_GOOGLE_CLIENT_ID: dry-run-prod.apps.googleusercontent.com
          DEV_FRONTEND_ORIGIN: https://dev.example.invalid
          TEST_FRONTEND_ORIGIN: https://test.example.invalid
          PROD_FRONTEND_ORIGIN: https://prod.example.invalid
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "${{ inputs.environment }}" = "prod" ]; then EXTRA+=(--owner-gate "${{ inputs.owner_gate }}"); fi
          case "${{ inputs.action }}" in
            validate) npm run env:validate -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run "${EXTRA[@]}" ;;
            bootstrap) npm run env:bootstrap -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run "${EXTRA[@]}" ;;
            deploy) npm run env:deploy -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run "${EXTRA[@]}" ;;
            status) npm run env:status -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run ;;
            isolation-test) npm run env:isolation-test -- --source-sha "$SOURCE_SHA" --dry-run ;;
            prod-preflight) npm run env:prod-preflight -- --source-sha "$SOURCE_SHA" --dry-run --owner-gate "${{ inputs.owner_gate }}" ;;
            *) echo "Unsupported action" >&2; exit 1 ;;
          esac

      - name: Resolve live DEV/TEST configuration
        if: ${{ inputs.dry_run == false && (inputs.environment == 'dev' || inputs.environment == 'test') }}
        env:
          DEV_CLOUDFLARE_ACCOUNT_ID: ${{ vars.DEV_CLOUDFLARE_ACCOUNT_ID }}
          DEV_CLOUDFLARE_TOKEN: ${{ secrets.DEV_CLOUDFLARE_TOKEN }}
          DEV_GITHUB_RUNTIME_TOKEN: ${{ secrets.DEV_GITHUB_RUNTIME_TOKEN }}
          DEV_SOURCE_READ_TOKEN: ${{ secrets.DEV_SOURCE_READ_TOKEN }}
          DEV_ALLOWED_GOOGLE_SUB: ${{ secrets.DEV_ALLOWED_GOOGLE_SUB }}
          DEV_GOOGLE_CLIENT_ID: ${{ vars.DEV_GOOGLE_CLIENT_ID }}
          DEV_FRONTEND_ORIGIN: ${{ vars.DEV_FRONTEND_ORIGIN }}
          TEST_CLOUDFLARE_ACCOUNT_ID: ${{ vars.TEST_CLOUDFLARE_ACCOUNT_ID }}
          TEST_CLOUDFLARE_TOKEN: ${{ secrets.TEST_CLOUDFLARE_TOKEN }}
          TEST_GITHUB_RUNTIME_TOKEN: ${{ secrets.TEST_GITHUB_RUNTIME_TOKEN }}
          TEST_SOURCE_READ_TOKEN: ${{ secrets.TEST_SOURCE_READ_TOKEN }}
          TEST_ALLOWED_GOOGLE_SUB: ${{ secrets.TEST_ALLOWED_GOOGLE_SUB }}
          TEST_GOOGLE_CLIENT_ID: ${{ vars.TEST_GOOGLE_CLIENT_ID }}
          TEST_FRONTEND_ORIGIN: ${{ vars.TEST_FRONTEND_ORIGIN }}
        shell: bash
        run: |
          set -euo pipefail
          target="${{ inputs.environment }}"
          case "$target" in
            dev)
              prefix=DEV
              cf_account="$DEV_CLOUDFLARE_ACCOUNT_ID"
              cf_token="$DEV_CLOUDFLARE_TOKEN"
              runtime_token="$DEV_GITHUB_RUNTIME_TOKEN"
              source_token="$DEV_SOURCE_READ_TOKEN"
              google_sub="$DEV_ALLOWED_GOOGLE_SUB"
              google_client="$DEV_GOOGLE_CLIENT_ID"
              origin="$DEV_FRONTEND_ORIGIN"
              runtime_repo="Shosetzel69/job-search-runtime-dev"
              ;;
            test)
              prefix=TEST
              cf_account="$TEST_CLOUDFLARE_ACCOUNT_ID"
              cf_token="$TEST_CLOUDFLARE_TOKEN"
              runtime_token="$TEST_GITHUB_RUNTIME_TOKEN"
              source_token="$TEST_SOURCE_READ_TOKEN"
              google_sub="$TEST_ALLOWED_GOOGLE_SUB"
              google_client="$TEST_GOOGLE_CLIENT_ID"
              origin="$TEST_FRONTEND_ORIGIN"
              runtime_repo="Shosetzel69/job-search-runtime-test"
              test "$cf_account" != "$DEV_CLOUDFLARE_ACCOUNT_ID" || { echo "TEST must use a Cloudflare account distinct from DEV" >&2; exit 1; }
              test "$runtime_token" != "$DEV_GITHUB_RUNTIME_TOKEN" || { echo "TEST must use a runtime token distinct from DEV" >&2; exit 1; }
              test "$source_token" != "$DEV_SOURCE_READ_TOKEN" || { echo "TEST must use a source-read token distinct from DEV" >&2; exit 1; }
              test "$google_client" != "$DEV_GOOGLE_CLIENT_ID" || { echo "TEST must use a Google OAuth client distinct from DEV" >&2; exit 1; }
              test "$origin" != "$DEV_FRONTEND_ORIGIN" || { echo "TEST must use an origin distinct from DEV" >&2; exit 1; }
              ;;
            *) echo "Unsupported live environment" >&2; exit 1 ;;
          esac

          for value_name in cf_account cf_token runtime_token source_token google_sub google_client origin; do
            test -n "${!value_name}" || { echo "Selected $target configuration is incomplete: $value_name" >&2; exit 1; }
          done

          {
            printf 'TARGET_ENV=%s\n' "$target"
            printf 'LIVE_RUNTIME_REPO=%s\n' "$runtime_repo"
            printf 'LIVE_WORKER_NAME=%s\n' 'job-search-command-api'
            printf 'LIVE_CLOUDFLARE_ACCOUNT_ID=%s\n' "$cf_account"
            printf 'LIVE_CLOUDFLARE_TOKEN=%s\n' "$cf_token"
            printf 'LIVE_GITHUB_RUNTIME_TOKEN=%s\n' "$runtime_token"
            printf 'LIVE_SOURCE_READ_TOKEN=%s\n' "$source_token"
            printf 'LIVE_ALLOWED_GOOGLE_SUB=%s\n' "$google_sub"
            printf 'LIVE_GOOGLE_CLIENT_ID=%s\n' "$google_client"
            printf 'LIVE_FRONTEND_ORIGIN=%s\n' "$origin"
            printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$cf_account"
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$cf_token"
            printf 'GH_TOKEN=%s\n' "$runtime_token"
            printf '%s_CLOUDFLARE_ACCOUNT_ID=%s\n' "$prefix" "$cf_account"
            printf '%s_CLOUDFLARE_TOKEN=%s\n' "$prefix" "$cf_token"
            printf '%s_GITHUB_RUNTIME_TOKEN=%s\n' "$prefix" "$runtime_token"
            printf '%s_SOURCE_READ_TOKEN=%s\n' "$prefix" "$source_token"
            printf '%s_ALLOWED_GOOGLE_SUB=%s\n' "$prefix" "$google_sub"
            printf '%s_GOOGLE_CLIENT_ID=%s\n' "$prefix" "$google_client"
            printf '%s_FRONTEND_ORIGIN=%s\n' "$prefix" "$origin"
          } >> "$GITHUB_ENV"

      - name: Install Command API deployment dependencies
        if: ${{ inputs.dry_run == false && (inputs.environment == 'dev' || inputs.environment == 'test') && (inputs.action == 'bootstrap' || inputs.action == 'deploy') }}
        run: npm --prefix command-api install --ignore-scripts --no-audit --no-fund

      - name: Execute live environment action
        if: ${{ inputs.dry_run == false && (inputs.environment == 'dev' || inputs.environment == 'test') }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.action }}" in
            validate) npm run env:validate -- --env "$TARGET_ENV" --source-sha "$SOURCE_SHA" ;;
            bootstrap) npm run env:bootstrap -- --env "$TARGET_ENV" --source-sha "$SOURCE_SHA" ;;
            deploy) npm run env:deploy -- --env "$TARGET_ENV" --source-sha "$SOURCE_SHA" ;;
            status) npm run env:status -- --env "$TARGET_ENV" --source-sha "$SOURCE_SHA" ;;
            isolation-test) echo "Use independent QA for provider isolation" >&2; exit 1 ;;
            prod-preflight) echo "prod-preflight is dry-run only" >&2; exit 1 ;;
            *) echo "Unsupported action" >&2; exit 1 ;;
          esac

      - name: Configure runtime/Worker secrets
        if: ${{ inputs.dry_run == false && (inputs.environment == 'dev' || inputs.environment == 'test') && inputs.action == 'bootstrap' }}
        shell: bash
        working-directory: command-api
        run: |
          set -euo pipefail
          printf '%s' "$LIVE_SOURCE_READ_TOKEN" | gh secret set SOURCE_READ_TOKEN --repo "$LIVE_RUNTIME_REPO"
          printf '%s' "$LIVE_GITHUB_RUNTIME_TOKEN" | npx wrangler secret put GITHUB_TOKEN --name "$LIVE_WORKER_NAME"
          printf '%s' "$LIVE_ALLOWED_GOOGLE_SUB" | npx wrangler secret put ALLOWED_GOOGLE_SUB --name "$LIVE_WORKER_NAME"

      - name: Verify credential roles and final health
        if: ${{ inputs.dry_run == false && (inputs.environment == 'dev' || inputs.environment == 'test') && inputs.action == 'bootstrap' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          label="${TARGET_ENV^^}"
          runtime_permission="$(GH_TOKEN="$LIVE_GITHUB_RUNTIME_TOKEN" gh repo view "$LIVE_RUNTIME_REPO" --json viewerPermission --jq .viewerPermission)"
          case "$runtime_permission" in WRITE|MAINTAIN|ADMIN) ;; *) echo "$label runtime token lacks runtime write permission" >&2; exit 1 ;; esac
          source_permission="$(GH_TOKEN="$LIVE_GITHUB_RUNTIME_TOKEN" gh repo view Shosetzel69/job-search-command-center --json viewerPermission --jq .viewerPermission 2>/dev/null || echo NONE)"
          case "$source_permission" in WRITE|MAINTAIN|ADMIN) echo "$label runtime token must not have source write permission" >&2; exit 1 ;; esac
          GH_TOKEN="$LIVE_SOURCE_READ_TOKEN" gh api "repos/Shosetzel69/job-search-command-center/commits/$SOURCE_SHA" --silent
          for attempt in 1 2 3 4 5 6; do
            if npm run env:status -- --env "$TARGET_ENV" --source-sha "$SOURCE_SHA"; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "$label readiness did not converge after 30 seconds" >&2
              exit 1
            fi
            echo "$label readiness not converged yet; retrying in 5 seconds (attempt $attempt/6)"
            sleep 5
          done
