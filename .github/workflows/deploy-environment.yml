name: Environment automation

on:
  workflow_dispatch:
    inputs:
      action:
        description: Environment automation action
        required: true
        type: choice
        options: [validate, status, isolation-test, prod-preflight]
      environment:
        description: Explicit target environment
        required: true
        type: choice
        options: [dev, test, prod]
      source_sha:
        description: Immutable source commit SHA
        required: true
        type: string
      issue_pr:
        description: Issue / PR reference; required for live DEV deploy and frozen into promotion evidence
        required: false
        type: string
      dev_evidence_run_id:
        description: Successful DEV promotion run id; required for live TEST deploy
        required: false
        type: string
      dry_run:
        description: Non-mutating validation/plan
        required: true
        default: true
        type: boolean
      owner_gate:
        description: Defense-in-depth confirmation for PROD preparation
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Guard immutable source and environment scope
        env:
          ISSUE_PR: ${{ inputs.issue_pr }}
          DEV_EVIDENCE_RUN_ID: ${{ inputs.dev_evidence_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.source_sha }}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_sha must be a full immutable commit SHA" >&2; exit 1; }
          if [ "${{ inputs.action }}" = "bootstrap" ] || [ "${{ inputs.action }}" = "deploy" ]; then
            echo "CLOUDFLARE_COMMAND_API_DEPLOY_RETIRED: use cloudbuild.promotion.yaml for GCP promotion" >&2
            exit 1
          fi
          if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.environment }}" = "prod" ]; then
            echo "Live PROD uses the dedicated permanent promotion workflow" >&2
            exit 1
          fi
          if [ "${{ inputs.action }}" = "prod-preflight" ] && [ "${{ inputs.environment }}" != "prod" ]; then
            echo "prod-preflight requires environment=prod" >&2
            exit 1
          fi
          if [ "${{ inputs.action }}" = "prod-preflight" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "prod-preflight is non-mutating and requires dry_run=true" >&2
            exit 1
          fi
          if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.action }}" = "isolation-test" ]; then
            echo "Provider isolation verification is reserved for independent QA; development runs only the static isolation contract" >&2
            exit 1
          fi
          if [ "${{ inputs.environment }}" = "prod" ] && [ "${{ inputs.owner_gate }}" != "APPROVED" ]; then
            echo "PROD preparation requires explicit owner confirmation" >&2
            exit 1
          fi
          if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.action }}" = "deploy" ] && [ "${{ inputs.environment }}" = "dev" ]; then
            test -n "$ISSUE_PR" || { echo "Live DEV deploy requires issue_pr for candidate freeze evidence" >&2; exit 1; }
          fi
          if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.action }}" = "deploy" ] && [ "${{ inputs.environment }}" = "test" ]; then
            [[ "$DEV_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Live TEST deploy requires a numeric dev_evidence_run_id" >&2; exit 1; }
          fi

      - name: Run environment contract tests
        run: npm run test:environment

      - name: Execute dry-run / static validation
        if: ${{ inputs.dry_run == true }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEV_CLOUDFLARE_ACCOUNT_ID: "11111111111111111111111111111111"
          TEST_CLOUDFLARE_ACCOUNT_ID: "22222222222222222222222222222222"
          PROD_CLOUDFLARE_ACCOUNT_ID: "33333333333333333333333333333333"
          DEV_CLOUDFLARE_TOKEN: dry-run-dev-cf
          TEST_CLOUDFLARE_TOKEN: dry-run-test-cf
          PROD_CLOUDFLARE_TOKEN: dry-run-prod-cf
          DEV_GITHUB_BOOTSTRAP_TOKEN: dry-run-dev-bootstrap
          TEST_GITHUB_BOOTSTRAP_TOKEN: dry-run-test-bootstrap
          PROD_GITHUB_BOOTSTRAP_TOKEN: dry-run-prod-bootstrap
          DEV_GITHUB_RUNTIME_TOKEN: dry-run-dev-runtime
          TEST_GITHUB_RUNTIME_TOKEN: dry-run-test-runtime
          PROD_GITHUB_RUNTIME_TOKEN: dry-run-prod-runtime
          DEV_SOURCE_READ_TOKEN: dry-run-dev-source
          TEST_SOURCE_READ_TOKEN: dry-run-test-source
          PROD_SOURCE_READ_TOKEN: dry-run-prod-source
          DEV_ALLOWED_GOOGLE_SUB: dry-run-dev-sub
          TEST_ALLOWED_GOOGLE_SUB: dry-run-test-sub
          PROD_ALLOWED_GOOGLE_SUB: dry-run-prod-sub
          DEV_GOOGLE_CLIENT_ID: dry-run-dev.apps.googleusercontent.com
          TEST_GOOGLE_CLIENT_ID: dry-run-test.apps.googleusercontent.com
          PROD_GOOGLE_CLIENT_ID: dry-run-prod.apps.googleusercontent.com
          DEV_FRONTEND_ORIGIN: https://dev.example.invalid
          TEST_FRONTEND_ORIGIN: https://test.example.invalid
          PROD_FRONTEND_ORIGIN: https://prod.example.invalid
          DEV_NILE_DATABASE_URL: postgresql://dev:password@db.example.invalid/jobsearch_dev
          TEST_NILE_DATABASE_URL: postgresql://test:password@db.example.invalid/jobsearch_test
          PROD_NILE_DATABASE_URL: postgresql://prod:password@db.example.invalid/jobsearch_prod
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "${{ inputs.environment }}" = "prod" ]; then EXTRA+=(--owner-gate "${{ inputs.owner_gate }}"); fi
          case "${{ inputs.action }}" in
            validate) npm run env:validate -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run "${EXTRA[@]}" ;;
            bootstrap) npm run env:bootstrap -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run "${EXTRA[@]}" ;;
            deploy) npm run env:deploy -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run "${EXTRA[@]}" ;;
            status) npm run env:status -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" --dry-run ;;
            isolation-test) npm run env:isolation-test -- --source-sha "$SOURCE_SHA" --dry-run ;;
            prod-preflight) npm run env:prod-preflight -- --source-sha "$SOURCE_SHA" --dry-run --owner-gate "${{ inputs.owner_gate }}" ;;
            *) echo "Unsupported action" >&2; exit 1 ;;
          esac

  live-readonly:
    if: ${{ inputs.dry_run == false && (inputs.environment == 'dev' || inputs.environment == 'test') && (inputs.action == 'validate' || inputs.action == 'status') }}
    needs: validate-request
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted control-plane from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          path: control-plane

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Execute live read-only environment action
        working-directory: control-plane
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEV_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.environment == 'dev' && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          TEST_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.environment == 'test' && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          DEV_CLOUDFLARE_TOKEN: ${{ inputs.environment == 'dev' && secrets.CLOUDFLARE_TOKEN || '' }}
          TEST_CLOUDFLARE_TOKEN: ${{ inputs.environment == 'test' && secrets.CLOUDFLARE_TOKEN || '' }}
          DEV_GITHUB_BOOTSTRAP_TOKEN: ${{ inputs.environment == 'dev' && 'bootstrap-not-required' || '' }}
          TEST_GITHUB_BOOTSTRAP_TOKEN: ${{ inputs.environment == 'test' && 'bootstrap-not-required' || '' }}
          DEV_GITHUB_RUNTIME_TOKEN: ${{ inputs.environment == 'dev' && secrets.GH_RUNTIME_TOKEN || '' }}
          TEST_GITHUB_RUNTIME_TOKEN: ${{ inputs.environment == 'test' && secrets.GH_RUNTIME_TOKEN || '' }}
          DEV_SOURCE_READ_TOKEN: ${{ inputs.environment == 'dev' && secrets.SOURCE_READ_TOKEN || '' }}
          TEST_SOURCE_READ_TOKEN: ${{ inputs.environment == 'test' && secrets.SOURCE_READ_TOKEN || '' }}
          DEV_ALLOWED_GOOGLE_SUB: ${{ inputs.environment == 'dev' && secrets.ALLOWED_GOOGLE_SUB || '' }}
          TEST_ALLOWED_GOOGLE_SUB: ${{ inputs.environment == 'test' && secrets.ALLOWED_GOOGLE_SUB || '' }}
          DEV_GOOGLE_CLIENT_ID: ${{ inputs.environment == 'dev' && vars.GOOGLE_CLIENT_ID || '' }}
          TEST_GOOGLE_CLIENT_ID: ${{ inputs.environment == 'test' && vars.GOOGLE_CLIENT_ID || '' }}
          DEV_FRONTEND_ORIGIN: ${{ inputs.environment == 'dev' && vars.FRONTEND_ORIGIN || '' }}
          TEST_FRONTEND_ORIGIN: ${{ inputs.environment == 'test' && vars.FRONTEND_ORIGIN || '' }}
          DEV_NILE_DATABASE_URL: ${{ inputs.environment == 'dev' && secrets.NILE_DATABASE_URL || '' }}
          TEST_NILE_DATABASE_URL: ${{ inputs.environment == 'test' && secrets.NILE_DATABASE_URL || '' }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.action }}" in
            validate) npm run env:validate -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" ;;
            status) npm run env:status -- --env "${{ inputs.environment }}" --source-sha "$SOURCE_SHA" ;;
            *) echo "Read-only live job accepts only validate/status" >&2; exit 1 ;;
          esac
