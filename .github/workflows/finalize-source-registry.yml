name: Source registry finalization (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject retired direct finalization path
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_REGISTRY_FINALIZER_RETIRED: update data/sources.json through a protected pull request; this workflow cannot mutate main." >&2
          exit 1
