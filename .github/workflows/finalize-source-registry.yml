name: Finalize validated source registry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-source-registry.yml"
      - "scripts/finalize_source_registry.py"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply validated source states
        run: python3 scripts/finalize_source_registry.py

      - name: Commit source registry if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/sources.json; then
            echo "Source Registry already up to date"
            exit 0
          fi
          git config user.name "job-search-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/sources.json
          git commit -m "Update Source Registry after ATS validation"
          git push origin HEAD:main
