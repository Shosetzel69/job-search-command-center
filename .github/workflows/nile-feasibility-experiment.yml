name: Nile ephemeral feasibility experiment (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nile-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      EXP_IMAGE: ghcr.io/niledatabase/testingcontainer@sha256:8e670df2a40b0cde96e01cccd62fc34d93bf97c065307d653a5cac940a82b869
      EXP_DB: jobsearch_dev
      EXP_BOOT_USER: 00000000-0000-0000-0000-000000000000
      EXP_BOOT_PASSWORD: password
    steps:
      - name: Check trusted run identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$CI" = true
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = Shosetzel69/job-search-command-center
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test -z "${NILE_DATABASE_URL:-}"
          test -z "${NILE_MIGRATION_DATABASE_URL:-}"
          test -z "${NILE_TEST_DATABASE_URL:-}"
          test -z "${JSCC_INTEGRATION_DATABASE_URL:-}"
          test -z "${JSCC_TEST_ADMIN_DATABASE_URL:-}"

      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify checked-out default-branch SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch

      - name: Node.js for isolated synthetic probe
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install existing pg dependency (no lifecycle scripts)
        working-directory: command-api
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/jscc555-r9-pg"
          mkdir -p "$PREFIX" node_modules
          printf '%s\n' '{"name":"jscc555-r9","version":"1.0.0","private":true,"dependencies":{"pg":"8.16.3"}}' > "$PREFIX/package.json"
          base64 --decode > "$PREFIX/package-lock.json" <<'LOCK'
