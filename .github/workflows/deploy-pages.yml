name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "data/jobs.json"
      - "data/run-status.json"
      - "data/applications.json"
      - "data/sources.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp -R frontend/. _site/
          cp data/jobs.json _site/data/jobs.json
          cp data/run-status.json _site/data/run-status.json
          cp data/applications.json _site/data/applications.json
          cp data/sources.json _site/data/sources.json
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/styles.css
          python3 -m json.tool _site/data/jobs.json >/dev/null
          python3 -m json.tool _site/data/run-status.json >/dev/null

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
