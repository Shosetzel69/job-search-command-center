name: AgentFlow PR321 controlled DEV live validation

on:
  push:
    branches:
      - feature/agentflow-313-320-remote-sources
    paths:
      - .github/workflows/agentflow-321-dev-live-validation.yml

permissions:
  contents: read

jobs:
  validate-live-connectors:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run controlled public live validation
        env:
          PYTHONPATH: scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit

          import job_search_breezyhr as breezyhr
          import job_search_pinpoint as pinpoint
          import job_search_traefik as traefik
          import web_transport

          report = {
              "schema_version": "1.0",
              "purpose": "PR #321 controlled DEV live validation",
              "candidate_sha": os.environ.get("GITHUB_SHA"),
              "checks": {},
          }

          def records_from(results):
              return [record for result in results if result.ok for record in result.records]

          def summarize(records):
              return [
                  {
                      "id": record.get("id"),
                      "title": record.get("job_title"),
                      "url": record.get("source_url"),
                  }
                  for record in records[:3]
              ]

          try:
              results = breezyhr.collect("cal-com", "Cal.com", max_postings=25)
              records = records_from(results)
              if not results or not all(result.ok for result in results):
                  raise AssertionError("BreezyHR connector returned a failed collection result")
              if not records:
                  raise AssertionError("Cal.com live BreezyHR board returned no job records")
              for record in records:
                  parsed = urlsplit(record["source_url"])
                  if parsed.scheme != "https" or parsed.hostname not in {
                      "cal-com.breezy.hr", "breezy.hr", "www.breezy.hr"
                  }:
                      raise AssertionError("Unexpected Cal.com BreezyHR job URL")
              report["checks"]["cal_com_breezyhr"] = {
                  "status": "PASS",
                  "route": "https://cal-com.breezy.hr/json?verbose=true",
                  "records": len(records),
                  "sample": summarize(records),
              }
          except Exception as exc:
              report["checks"]["cal_com_breezyhr"] = {
                  "status": "FAIL",
                  "error": f"{type(exc).__name__}: {exc}",
              }

          try:
              results = pinpoint.collect("safetywing", "SafetyWing", max_postings=25)
              records = records_from(results)
              if not results or not all(result.ok for result in results):
                  raise AssertionError("Pinpoint connector returned a failed collection result")
              if not records:
                  raise AssertionError("SafetyWing live Pinpoint board returned no job records")
              for record in records:
                  parsed = urlsplit(record["source_url"])
                  if parsed.scheme != "https" or parsed.hostname != "safetywing.pinpointhq.com":
                      raise AssertionError("Unexpected SafetyWing Pinpoint job URL")
              report["checks"]["safetywing_pinpoint"] = {
                  "status": "PASS",
                  "route": "https://safetywing.pinpointhq.com/postings.json",
                  "records": len(records),
                  "sample": summarize(records),
              }
          except Exception as exc:
              report["checks"]["safetywing_pinpoint"] = {
                  "status": "FAIL",
                  "error": f"{type(exc).__name__}: {exc}",
              }

          class URLAttributes(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.urls = []

              def handle_starttag(self, _tag, attrs):
                  for key, value in attrs:
                      if key.lower() in {"href", "src", "action", "data-url"} and value:
                          self.urls.append(value)

          supported_provider_hosts = {
              "greenhouse.io",
              "lever.co",
              "ashbyhq.com",
              "breezy.hr",
              "pinpointhq.com",
              "bamboohr.com",
              "recruitee.com",
              "myworkdayjobs.com",
              "workdayjobs.com",
              "smartrecruiters.com",
          }

          try:
              client = web_transport.PublicClient(time.monotonic() + 60)
              final_url, landing_html = client.get(traefik.CAREERS_URL)
              parser = URLAttributes()
              parser.feed(landing_html)
              fingerprints = []
              for raw_url in parser.urls:
                  candidate = urljoin(final_url, raw_url)
                  host = (urlsplit(candidate).hostname or "").lower()
                  if any(host == provider or host.endswith("." + provider)
                         for provider in supported_provider_hosts):
                      fingerprints.append(candidate)
              fingerprints = sorted(set(fingerprints))
              if fingerprints:
                  raise AssertionError(
                      "Supported generic provider fingerprint found: " + ", ".join(fingerprints[:5])
                  )
              report["checks"]["traefik_provider_fingerprint"] = {
                  "status": "PASS",
                  "careers_url": final_url,
                  "supported_provider_fingerprints": [],
                  "attribute_urls_inspected": len(parser.urls),
              }
          except Exception as exc:
              report["checks"]["traefik_provider_fingerprint"] = {
                  "status": "FAIL",
                  "error": f"{type(exc).__name__}: {exc}",
              }

          try:
              results = traefik.collect(max_postings=3)
              records = records_from(results)
              if not results or not all(result.ok for result in results):
                  raise AssertionError("Traefik connector returned a failed collection result")
              if not records:
                  raise AssertionError("Traefik live careers parser returned no job records")
              for record in records:
                  parsed = urlsplit(record["source_url"])
                  if parsed.scheme != "https" or parsed.hostname not in traefik.ALLOWED_HOSTS:
                      raise AssertionError("Unexpected Traefik job URL")
              report["checks"]["traefik_bounded_parser"] = {
                  "status": "PASS",
                  "route": traefik.CAREERS_URL,
                  "records_sampled": len(records),
                  "total_available": results[0].total_available,
                  "sample": summarize(records),
              }
          except Exception as exc:
              report["checks"]["traefik_bounded_parser"] = {
                  "status": "FAIL",
                  "error": f"{type(exc).__name__}: {exc}",
              }

          report["overall"] = (
              "PASS"
              if report["checks"] and all(check["status"] == "PASS" for check in report["checks"].values())
              else "FAIL"
          )

          output = json.dumps(report, ensure_ascii=False, indent=2)
          with open("artifacts/pr321-dev-live-validation.json", "w", encoding="utf-8") as handle:
              handle.write(output + "\n")
          print(output)

          if report["overall"] != "PASS":
              sys.exit(1)
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr321-dev-live-validation
          path: artifacts/pr321-dev-live-validation.json
          if-no-files-found: error
          retention-days: 90
