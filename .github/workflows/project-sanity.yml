name: Project sanity snapshot

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: project-sanity-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Generate read-only current project state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project-state
          npm run sanity:project -- \
            --output-json project-state/current-project-state.json \
            --output-md project-state/current-project-state.md

      - name: Publish snapshot artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-project-state
          path: project-state/
          if-no-files-found: error
          retention-days: 30

      - name: Add readable snapshot to job summary
        shell: bash
        run: cat project-state/current-project-state.md >> "$GITHUB_STEP_SUMMARY"
