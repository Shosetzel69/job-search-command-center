name: Executable task
description: Development, QA or operational task with bounded context.
title: ""
labels: []
body:
  - type: dropdown
    id: process
    attributes:
      label: Process
      description: Execution process for this work item. Do not change it silently after work starts.
      options:
        - AGENTFLOW
        - LEGACY-ADAPTED
        - INHERIT-PARENT
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Phase
      description: Canonical workflow phase from GOVERNANCE.md section 2.8.
      placeholder: DEVELOPMENT_ANALYSIS
    validations:
      required: true

  - type: input
    id: status
    attributes:
      label: Status
      description: Canonical status valid for the selected Phase. Do not use BLOCKED/READY FOR DEV/WAITING FOR as free-form aliases.
      placeholder: DEVELOPMENT_ANALYSIS
    validations:
      required: true

  - type: input
    id: blocked_by
    attributes:
      label: Blocked by
      description: Issue/gate/reason only when the canonical Status is blocked; otherwise leave empty.
    validations:
      required: false

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What result must this task produce?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Only the context needed to understand this task. Prefer 3-5 lines.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included?
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What must not be changed? Use N/A if nothing specific.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete conditions for completion.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: textarea
    id: required_context
    attributes:
      label: Required context
      description: Exact files/sections the executor must read. Link instead of copying content.
      placeholder: |
        - path/to/file.md - section name
    validations:
      required: true

  - type: textarea
    id: optional_context
    attributes:
      label: Optional context
      description: Read only if a question remains.
    validations:
      required: false
