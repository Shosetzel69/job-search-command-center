name: Executable task
description: Independent Development, QA or operational outcome; local defects belong in the root Issue.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Root-first (§2.9):** check existing Issues before creating this one. Local bugs, QA/review findings and remediation belong in the owning Issue as OBS-ID + evidence comments. A new Issue requires an independent deliverable, a cross-feature dependency or a separately governed scope/control. This form does not protect direct API creation.
  - type: dropdown
    id: reason_for_separate_issue
    attributes:
      label: Why a separate Issue?
      description: Choose the applicable §2.9 exception. Do not open this form for a local OBS item.
      options:
        - Independently approvable outcome (new root)
        - Cross-feature blocker or shared dependency
        - Distinct scope or control that cannot be tracked safely in the root
    validations:
      required: true
  - type: dropdown
    id: process
    attributes:
      label: Process
      description: Execution process for this work item. Do not change it silently after work starts.
      options:
        - AGENTFLOW
        - LEGACY-ADAPTED
        - INHERIT-PARENT
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Phase
      description: Canonical workflow phase from GOVERNANCE.md section 2.8.
      placeholder: DEVELOPMENT_ANALYSIS
    validations:
      required: true

  - type: input
    id: status
    attributes:
      label: Status
      description: Canonical status valid for the selected Phase. Do not use BLOCKED/READY FOR DEV/WAITING FOR as free-form aliases.
      placeholder: DEVELOPMENT_ANALYSIS
    validations:
      required: true

  - type: input
    id: blocked_by
    attributes:
      label: Blocked by
      description: Issue/gate/reason only when the canonical Status is blocked; otherwise leave empty.
    validations:
      required: false

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What result must this task produce?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Summarize in 3-5 lines. For derived/shared Issues, link affected root(s), justify why OBS-ID is insufficient, and state the verifiable unblock condition.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included?
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What must not be changed? Use N/A if nothing specific.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete conditions for completion.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: textarea
    id: required_context
    attributes:
      label: Required context
      description: Exact files/sections the executor must read. Link instead of copying content.
      placeholder: |
        - path/to/file.md - section name
    validations:
      required: true

  - type: textarea
    id: optional_context
    attributes:
      label: Optional context
      description: Read only if a question remains.
    validations:
      required: false
