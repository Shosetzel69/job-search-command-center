# ATC-537-01: isolated Remote Executor supply chain. DEV only.
substitutions:
  _GIT_SHA: ""
  _GATEWAY_IMAGE: "europe-west1-docker.pkg.dev/jscc-shared/jscc-ops/jscc-ops-gateway"
  _WORKER_IMAGE: "europe-west1-docker.pkg.dev/jscc-shared/jscc-ops/jscc-diagnostics"
steps:
  - id: validate-candidate
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args: ['-ceu', '[[ "${_GIT_SHA}" =~ ^[0-9a-f]{40}$ ]] && [[ "${COMMIT_SHA}" == "${_GIT_SHA}" ]]']
  - id: ops-contract-tests
    name: node:22-bookworm-slim
    entrypoint: bash
    args: ['-ceu', 'cd ops && node --test test/*.test.mjs && node --check src/lib.mjs && node --check src/gateway.mjs && node --check src/worker.mjs']
  - id: registry-immutability
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args: ['-ceu', 'v="$(gcloud artifacts repositories describe jscc-ops --project=jscc-shared --location=europe-west1 --format=value\\(dockerConfig.immutableTags\\))"; [[ "$v" == True || "$v" == true ]]']
  - id: build-gateway
    name: gcr.io/cloud-builders/docker
    args: ['build','--pull','-f','ops/Dockerfile.gateway','--build-arg','SOURCE_SHA=${_GIT_SHA}','-t','${_GATEWAY_IMAGE}:${_GIT_SHA}','.']
  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args: ['build','--pull','-f','ops/Dockerfile.worker','--build-arg','SOURCE_SHA=${_GIT_SHA}','-t','${_WORKER_IMAGE}:${_GIT_SHA}','.']
  - id: push-gateway
    name: gcr.io/cloud-builders/docker
    args: ['push','${_GATEWAY_IMAGE}:${_GIT_SHA}']
  - id: push-worker
    name: gcr.io/cloud-builders/docker
    args: ['push','${_WORKER_IMAGE}:${_GIT_SHA}']
  - id: evidence
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        for image in "${_GATEWAY_IMAGE}:${_GIT_SHA}" "${_WORKER_IMAGE}:${_GIT_SHA}"; do
          digest="$(gcloud artifacts docker images describe "$image" --project=jscc-shared --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "OPS_IMAGE=$image@$digest"
        done
serviceAccount: projects/jscc-shared/serviceAccounts/jscc-ops-build@jscc-shared.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
