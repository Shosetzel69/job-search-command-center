# ATC-537-01: isolated Remote Executor supply chain. DEV only.
substitutions:
  _GIT_SHA: ""
  _TRUSTED_REF: ""
  _GATEWAY_IMAGE: "europe-west1-docker.pkg.dev/jscc-shared/jscc-ops/jscc-ops-gateway"
  _WORKER_IMAGE: "europe-west1-docker.pkg.dev/jscc-shared/jscc-ops/jscc-diagnostics"
steps:
  - id: trusted-source-admission
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args: ['scripts/gcp/verify_trusted_ops_ref.sh']
    env:
      - 'SOURCE_SHA=${_GIT_SHA}'
      - 'TRUSTED_OPS_REF=${_TRUSTED_REF}'

  - id: materialize-verified-source
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    env:
      - 'SOURCE_SHA=${_GIT_SHA}'
      - 'TRUSTED_OPS_REF=${_TRUSTED_REF}'
    args:
      - -ceu
      - |
        set -o pipefail
        git_root=/workspace/jscc589-ops-verified-git
        source_root=/workspace/jscc589-ops-verified-src
        [[ ! -e "$$git_root" && ! -e "$$source_root" ]]
        mkdir -p "$$source_root"
        git init --quiet "$$git_root"
        git -C "$$git_root" remote add origin https://github.com/Shosetzel69/job-search-command-center.git
        git -C "$$git_root" fetch --quiet --no-tags --depth=1 origin "$$TRUSTED_OPS_REF"
        [[ "$$(git -C "$$git_root" rev-parse FETCH_HEAD)" == "$$SOURCE_SHA" ]] || {
          echo "TRUSTED_BUILD_CONTEXT=BLOCKED source_sha_mismatch" >&2
          exit 42
        }
        git -C "$$git_root" archive --format=tar "$$SOURCE_SHA" | tar -xf - -C "$$source_root"
        [[ -f "$$source_root/ops/src/lib.mjs" ]]
        echo "TRUSTED_BUILD_CONTEXT=VERIFIED"

  - id: validate-candidate
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    env:
      - 'SOURCE_SHA=${_GIT_SHA}'
    args: ['-ceu', '[[ "$$SOURCE_SHA" =~ ^[0-9a-f]{40}$$ ]]']
  - id: python-contract-tests
    name: python:3.12-slim-bookworm
    entrypoint: python3
    dir: /workspace/jscc589-ops-verified-src
    args: ['-m', 'unittest', '-v', 'scripts.test_gateway_v2_scaling']
  - id: ops-contract-tests
    name: node:22-bookworm-slim
    dir: /workspace/jscc589-ops-verified-src
    entrypoint: bash
    args:
      - -ceu
      - |
        node scripts/check_cloud_run_api_version.mjs
        node --test scripts/test_cloud_run_api_version.mjs
        cd ops
        npm install --ignore-scripts --no-audit --no-fund
        node --test test/*.test.mjs
        node --check src/lib.mjs
        node --check src/gateway.mjs
        node --check src/worker.mjs
        node -e "Promise.all([import('@node-oauth/oauth2-server'),import('openid-client')])"
  - id: registry-immutability
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        v="$$(gcloud artifacts repositories describe jscc-ops --project=jscc-shared --location=europe-west1 --format='value(dockerConfig.immutableTags)')"
        [[ "$$v" == "True" || "$$v" == "true" ]]

  - id: detect-existing-images
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    env:
      - 'SOURCE_SHA=${_GIT_SHA}'
    args:
      - -ceu
      - |
        rm -f /workspace/.gateway-exists /workspace/.worker-exists
        if gcloud artifacts docker images describe "${_GATEWAY_IMAGE}:$$SOURCE_SHA" --project=jscc-shared >/dev/null 2>&1; then
          touch /workspace/.gateway-exists
          echo "REUSE_GATEWAY_TAG=$$SOURCE_SHA"
        fi
        if gcloud artifacts docker images describe "${_WORKER_IMAGE}:$$SOURCE_SHA" --project=jscc-shared >/dev/null 2>&1; then
          touch /workspace/.worker-exists
          echo "REUSE_WORKER_TAG=$$SOURCE_SHA"
        fi

  - id: build-gateway
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - 'SOURCE_SHA=${_GIT_SHA}'
    args:
      - -ceu
      - |
        if [[ -f /workspace/.gateway-exists ]]; then
          echo "SKIP_GATEWAY_BUILD_EXISTING_IMMUTABLE_TAG"
        else
          docker build --pull -f /workspace/jscc589-ops-verified-src/ops/Dockerfile.gateway --build-arg "SOURCE_SHA=$$SOURCE_SHA" -t "${_GATEWAY_IMAGE}:$$SOURCE_SHA" /workspace/jscc589-ops-verified-src
        fi

  - id: build-worker
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - 'SOURCE_SHA=${_GIT_SHA}'
    args:
      - -ceu
      - |
        if [[ -f /workspace/.worker-exists ]]; then
          echo "SKIP_WORKER_BUILD_EXISTING_IMMUTABLE_TAG"
        else
          docker build --pull -f /workspace/jscc589-ops-verified-src/ops/Dockerfile.worker --build-arg "SOURCE_SHA=$$SOURCE_SHA" -t "${_WORKER_IMAGE}:$$SOURCE_SHA" /workspace/jscc589-ops-verified-src
        fi


  - id: verify-image-source
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - 'SOURCE_SHA=${_GIT_SHA}'
    args:
      - -ceu
      - |
        set -o pipefail
        root=/workspace/jscc589-ops-verified-src/ops
        verify_image() {
          local image="$$1" marker="$$2" role="$$3" tmp cid=
          if [[ -f "$$marker" ]]; then docker pull "$$image"; fi
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$$image" |
            grep -Fx "SOURCE_SHA=$$SOURCE_SHA" >/dev/null
          tmp="$$(mktemp -d)"
          (
            trap 'if [[ -n "$$cid" ]]; then docker rm "$$cid" >/dev/null; fi; rm -rf "$$tmp"' EXIT
            cid="$$(docker create --network none "$$image")"
            docker cp "$$cid:/workspace/ops/src" "$$tmp/src"
            diff -qr "$$root/src" "$$tmp/src"
            docker cp "$$cid:/workspace/ops/package.json" "$$tmp/package.json"
            cmp "$$root/package.json" "$$tmp/package.json"
            docker cp "$$cid:/workspace/ops/observation/dev-runtime-observer.mjs" "$$tmp/observer.mjs"
            cmp "$$root/observation/dev-runtime-observer.mjs" "$$tmp/observer.mjs"
            if [[ "$$role" == worker ]]; then
              docker cp "$$cid:/workspace/ops/observation/dev-rollout-evaluator.mjs" "$$tmp/evaluator.mjs"
              cmp "$$root/observation/dev-rollout-evaluator.mjs" "$$tmp/evaluator.mjs"
            fi
            echo "OPS_IMAGE_SOURCE_VERIFIED=$$role"
          )
        }
        verify_image "${_GATEWAY_IMAGE}:$$SOURCE_SHA" /workspace/.gateway-exists gateway
        verify_image "${_WORKER_IMAGE}:$$SOURCE_SHA" /workspace/.worker-exists worker

  - id: push-gateway
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - 'SOURCE_SHA=${_GIT_SHA}'
    args:
      - -ceu
      - |
        if [[ -f /workspace/.gateway-exists ]]; then
          echo "REUSE_GATEWAY_IMMUTABLE_TAG"
        else
          docker push "${_GATEWAY_IMAGE}:$$SOURCE_SHA"
        fi

  - id: push-worker
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - 'SOURCE_SHA=${_GIT_SHA}'
    args:
      - -ceu
      - |
        if [[ -f /workspace/.worker-exists ]]; then
          echo "REUSE_WORKER_IMMUTABLE_TAG"
        else
          docker push "${_WORKER_IMAGE}:$$SOURCE_SHA"
        fi
  - id: evidence
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    env:
      - 'SOURCE_SHA=${_GIT_SHA}'
    args:
      - -ceu
      - |
        for image in "${_GATEWAY_IMAGE}:$$SOURCE_SHA" "${_WORKER_IMAGE}:$$SOURCE_SHA"; do
          digest="$$(gcloud artifacts docker images describe "$$image" --project=jscc-shared --format='value(image_summary.digest)')"
          [[ "$$digest" =~ ^sha256:[0-9a-f]{64}$$ ]]
          echo "OPS_IMAGE=$$image@$$digest"
        done
serviceAccount: projects/jscc-shared/serviceAccounts/jscc-ops-build@jscc-shared.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
