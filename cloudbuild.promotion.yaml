substitutions:
  _GIT_SHA: ""
  _TARGET: "dev"

steps:
  - id: validate-input
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        [[ "${_GIT_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "_GIT_SHA must be a full lowercase SHA" >&2; exit 2; }
        [[ "${_TARGET}" == "dev" || "${_TARGET}" == "dev-test" ]] || { echo "_TARGET must be dev or dev-test" >&2; exit 2; }
        if [[ -n "${COMMIT_SHA:-}" ]]; then
          [[ "${COMMIT_SHA}" == "${_GIT_SHA}" ]] || { echo "Cloud Build commit identity mismatch" >&2; exit 2; }
        fi

  - id: regression
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m unittest -v           scripts.test_runtime_data_boundary           scripts.test_container_packaging           scripts.test_gcp_runtime_seed_manifest           scripts.test_gcp_promotion_contract
        cd scripts
        python -m unittest -v test_source_orchestration test_public_boards

  - id: frontend-and-api-tests
    name: node:22-bookworm-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        cd command-api
        npm install --ignore-scripts --no-audit --no-fund
        node --test test/*.test.mjs
        cd ../frontend
        npm install --ignore-scripts --no-audit --no-fund
        node --test test/*.test.mjs
        npm run build

  - id: build-job-if-missing
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        image="europe-west1-docker.pkg.dev/jscc-shared/jscc/jscc:${_GIT_SHA}"
        if gcloud artifacts docker images describe "${image}" --project=jscc-shared --format='value(image_summary.digest)' >/dev/null 2>&1; then
          echo "REUSE_JOB_ARTIFACT=${image}"
        else
          docker build --pull --build-arg "GIT_SHA=${_GIT_SHA}" -t "${image}" .
          docker push "${image}"
        fi

  - id: build-service-if-missing
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        image="europe-west1-docker.pkg.dev/jscc-shared/jscc/jscc-service:${_GIT_SHA}"
        if gcloud artifacts docker images describe "${image}" --project=jscc-shared --format='value(image_summary.digest)' >/dev/null 2>&1; then
          echo "REUSE_SERVICE_ARTIFACT=${image}"
        else
          docker build --pull --file Dockerfile.service --build-arg "GIT_SHA=${_GIT_SHA}" -t "${image}" .
          docker push "${image}"
        fi

  - id: promote-dev
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        bash scripts/gcp/promote.sh dev "${_GIT_SHA}"

  - id: promote-test
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_TARGET}" == "dev-test" ]]; then
          bash scripts/gcp/promote.sh test "${_GIT_SHA}" "artifacts/gcp-promotion/dev-${_GIT_SHA}.json"
        else
          echo "TEST promotion not requested"
        fi

  - id: summarize
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        python - <<'PY'
        import glob,json
        for path in sorted(glob.glob("artifacts/gcp-promotion/*.json")):
            with open(path,encoding="utf-8") as f:
                data=json.load(f)
            print(json.dumps(data,sort_keys=True))
        PY

serviceAccount: projects/jscc-shared/serviceAccounts/jscc-build@jscc-shared.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
